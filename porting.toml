schema_version = 1

[device]
name = "myron"
soc = "SM8850"
os_profile = "ios-26.5.2-23F84"
summary = "Redmi K90 Pro Max (myron) on Qualcomm SM8850 Canoe, targeting iOS 26.5.2 (build 23F84, Darwin 25.5.0, XNU 12377.121.6, arm64e) with an iPad17,3 identity. The record below was written for the NX769J / iOS 16.7.16 predecessor of this repository: its hardware areas still describe work that carries over, but its kernel and payload narratives describe xnu-8796 and are stale. MIGRATION.md states which parts have been re-established for iOS 26 and which have not. Read it before trusting a status here."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "SoftwareAES", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/**", ".gitmodules", ".github/**", ".gitignore", ".gitattributes", "local.toml.example", "PENDING.json", "scripts/linux/**"]
inputs = ["SM8650 register map and CPU topology from mainline sm8650.dtsi.", "iOS 16.5 build 20F66 OS profile with XNU 8796.101.5.", "UniXNU-sm8550-common revision 23b2049fcd9e30356161def84231334fb55ecca9 as the SoC source.", "Board identity from the NX769J Android 14 vendor firmware and board configuration."]
configuration = ["board.name = nx769j; board.soc = SM8650; board.soc_source = sm8550; board.os_profile = ios-16.5-20F66; schema_version = 2.", "components.include lists the complete selection; arrays replace the inherited ARM64, SoC and OS arrays.", "kernel.defconfig = nx769j_defconfig; config_fragments apply arch, soc, os in order and the device defconfig last.", "device_tree.source = device:dts/nx769j.dts with include_dirs = [soc:dts].", "Board submodules are not used; every driver comes from the component catalog at its pinned revision."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig nx769j_defconfig -D ../UniXNU-NX769J from the UniXNU checkout.", "Run ./unixnu fetch -D ../UniXNU-NX769J and commit the resulting unixnu.lock.", "Run ./unixnu status --json -D ../UniXNU-NX769J and review the resolved profiles, components, source pins and patch order, then ./unixnu tree -D ../UniXNU-NX769J."]
findings = ["Tables merge in ARM64, SoC, OS, device order and arrays replace inherited arrays, so the device must list every required component and fragment.", "board.toml sets bootimg.image.header_version to 0 rather than the 4 the NX769J board configuration records. unixnu bootimg verify() reads the header at the v0/v1/v2 offsets and would reject a v4 image, and the tool defaults use 0. The reasoning and the open question about what the NX769J ABL accepts are recorded in the packaging area.", "soc:configs/sm8550.config sets CONFIG_XNU_NATIVE_ADRENO=y. The device defconfig applies last and sets CONFIG_XNU_NATIVE_ADRENO=n because the SM8550 GPU stack targets Adreno 740 while this board has Adreno 750.", "There is no UniXNU-sm8650-common. sm8550-common is usable as the SoC source because the register map of every resource this port drives is identical on both parts: GICD 0x17100000/0x10000, GICR 0x17180000/0x200000, UFS host 0x01d84000/0x3000, UFS PHY 0x01d80000/0x2000, GPU 0x03d00000/0x40000, GMU 0x03d6a000/0x35000 and GPU SMMU 0x03da0000/0x40000. The CPU core names and the Adreno generation do differ and are overridden in the board DTS and defconfig. The device confirms the UFS ranges in /proc/iomem and the MPIDR layout in its CPU nodes.", "board.os_profile selects a directory under UniXNU/profiles/os/, and this port targets ios-16.5-20F66, which does not exist in UniXNU yet. The profile is kept in this repository at os-profiles/ios-16.5-20F66/ and the Build workflow installs it into the UniXNU checkout before resolving. The [ipsw] and [kernel.prelink] tables are inherited from that profile rather than repeated here, so the REQUIRED_IPSW fields are filled in one file.", "board.toml selects only device:patches/xnu/series. The shared arch, soc and os series still target xnu-10063.141.1 while this port runs xnu-8796, so referencing them would either abort unixnu status with 'patch missing' or fail during application. The rebased copies are carried here and the four-series form goes back once the shared series are rebased.", "unixnu status resolves the complete ordered patch series, so it needs the source of every component named by a component: entry. The 17.7.11 OS series names XnuPrelink twice and status aborts with 'patch missing' when that source is absent, while defconfig alone succeeds because it only reads the configuration fragments. The resolve build test therefore runs fetch and tree before status, which is the step 4 order in the porting guide.", "unixnu fetch records component sources in unixnu.lock as well as feed sources when the device repository declares no git submodules. UniXNU-sheng pins its board drivers as submodules and its lock carries feed sources only; this repository carries both, and every component revision in the lock matches its pin in the component catalog.", "unixnu.lock is machine written: fetch rewrites it with a single header comment and drops any comment added by hand. Keep explanations out of the lock and record them here, so the file stays byte-identical to what fetch produces. The profile's explicit xnu_revision takes priority over the lock, so the xnu entry follows the OS profile.", "The default install path writes the OS windows into userdata, which is Android's /data and leaves the system images intact but the stock install unusable. The dual-system partition tool instead carves a unixnu partition from the end of userdata, preserving userdata's start, type, GUID and attributes and leaving metadata, super and boot untouched. README.md records the four-step order that ends in adb reboot system, which is the check that the stock system still boots.", "The dual-system partition tests are documented for Linux, WSL and macOS. On a native Windows host the four RecoveryTests fail because they drive twrp.sh through a POSIX sh and a colon PATH, so they run in the partition-safety build job on ubuntu-latest instead. The seven layout tests that cover GPT entry and GUID preservation, reserved GPT space and F2FS section rounding pass on either host.", "The board hardware values that no public source provides were read from a physical device over read-only adb and recorded in device-inputs.md: the userdata GPT extents and block size, the splash reservation, the DRAM base and the panel geometry. The handset reports a spoofed Xiaomi identity through its userspace properties while its boot image, kernel and device tree identify NX769J, so the values came from the kernel, the device tree and the raw UFS partition table rather than from getprop.", "The kernel build runs in CI on ubuntu-latest with the UniXNU Linux toolchain, upstream clang and an open source Mach-O toolchain rather than Xcode. The toolchain is expensive to build and is cached under /opt/unixnu-linux keyed on scripts/linux. The job also asserts that the patch order unixnu resolves matches patches/xnu/series exactly, so a reordered or dropped patch fails the build rather than silently changing what gets compiled.", "The toolchain cache never persisted and every kernel run rebuilt clang from source, which is the whole 37 minutes. The kernel job is expected to fail while this port is being brought up and actions/cache's combined form only saves on success, so the entry was never written. save-always had no effect and was replaced with explicit restore and save steps, the save running on always(). Restoring the cache then skipped setup-toolchain.py and with it the apt packages the toolchain links against, so --check failed on missing libclang and libbsd; the host dependencies are now installed in their own step regardless of the cache. The installer itself must also run on a cache hit: it places /usr/bin/xcrun and the CLT shims in system paths the cache cannot hold, and scripts/unixnu/kernel.py requires xcrun, so a cache hit skipped the step and the build stopped at 'xcrun missing'. The installer is idempotent and skips each component that already exists, so running it always costs nothing when the cache hits. Installing under the runner's home rather than /opt is separate hygiene: the installer runs as root and the path is expanded before sudo because sudo resets HOME to /root. scripts/unixnu/kernel.py resolves the toolchain through UNIXNU_TOOLCHAIN, so the same variable drives both the install and the build.", "The kernel step writes its compile errors to logs/kernel-bootstrap.log rather than stdout. Parallel make then interleaves that file so heavily that the diagnostic for the failing compile is garbled past reading, and a failing run was not diagnosable at all. The job uploads out/**/logs as an artifact and repeats the build with -j 1 on failure, so the retry names the actual error. The retry is incremental because the objects from the parallel pass are reused.", "A change under .github/**, unixnu.lock or os-profiles/** is owned here or in the packaging area, so such a change has to land with a matching finding or evidence entry in the owning area to satisfy the record checker's changed-area rule.", "payload.adt.root_match_volume_uuid is now filled, so [payload.adt] has no REQUIRED_ placeholder left. It is the APFS volume UUID of the OS window, 97A3EB1A-5218-4936-BC85-9574EC2C8CC9, and not the container UUID c155fa03-68f4-42b0-8117-1915b6aa8e4c that sits in the same superblock: /chosen/root-matching matches IOMedia, and the container UUID belongs to the synthesized whole-disk IOMedia rather than to anything that mounts. scripts/extract-root-volume-uuid.py reads the value out of the userdata image the build writes, so it needs no device and no macOS.", "The Data seed workflow puts its diagnostics in the job summary rather than only in the log: the runner's free disk before the download, the disk again once the restore image is deleted, and the seed report. Job logs need repository access to read, so a summary plus an ERR trap in every run step is what makes a failed run diagnosable from the run page: the trap prints ::error title=<step>::<command> and the annotations block is public. The 6 GiB restore image is not cached either -- a cache entry that size doubles the disk peak of a step that is already holding the archive and its 4.7 GiB OS member, and the archive is deleted as soon as the member is out. The Data seed workflow ran twice and failed twice before it was right: cache keys reject commas and the product type iPhone10,3 was in the first key, and the seed script then made a 32 MiB container and grew it, which is both an extra round of attach and resize and a size the iOS 16.5 var tree may not fit into. It now creates the container at its target size and refuses up front when the tree would not fit. [payload] tools = true adds a Tools entry to the generated boot menu, which is where the firmware log exporter publishes its QR pages. The generated menu replaces the built-in one and with it its Restart and Power off, so payload.py adds those back; package/unixnu.toml is a hand-written menu and is not the one the payload carries. .github/workflows/data-seed.yml is the macOS runner job that builds the Data seed, and it reads its restore-image pins out of os-profiles/ios-16.5-20F66/profile.toml so the workflow and the profile cannot drift apart.", "RETARGETED to iOS 26.5.2 (23F84, arm64e) on 2026-11-16. The device identity, defconfig name, patch order and OS profile all changed; MIGRATION.md records each field and the evidence behind it. Three defects were found by running the driver and fixed here: soc:patches/xnu-12377/series does not exist at the pinned sm8550 commit (the SoC series is patches/xnu/series), CONFIG_XNU_NATIVE_PAC is not a switch at all because PAC is unconditional in the arm64e series, and CONFIG_XNU_NATIVE_AES is set by no fragment so the inherited expectation for it could never pass. The Build workflow was retargeted in the same change. Its merged-config check now names the sixteen switches that really resolve on this target, verified with check-merged-config.py against a config assembled from the real fragments; its patch-order check asserts the arch + soc + os shape by the directory each entry resolves from, because the retired iOS 16 series shares about fifty file names with the arm64e one and comparing names would either miss a real double-application or flag a harmless collision. Its device-tree checks count device_type nodes rather than arm,cortex-* compatible strings: the stock myron DTB uses arm,armv8, so counting cortex-* returned zero and, under bash -e, failed a job whose trees had in fact compiled. Every grep -c in that job is now guarded with || true for the same reason. Two CI runs were needed to find these: the first failed on a porting-record evidence reference to the defconfig name from before the rename, the second on the cortex-* count.", "CI FOUND FIVE FAULTS THAT READING THE WORKFLOW COULD NOT. The Build workflow was retargeted for this board and then run five times; four runs exposed a fault in the workflow itself rather than in the board, and the fifth exposed this record. All are now fixed. (1) porting-record failed with 'display: evidence file missing: configs/nx769j_defconfig' because an evidence reference still named the defconfig from before the rename to myron_ios26_defconfig; the checker runs with --base on every push and validates every area reference, so it caught this rather than review. (2) the device-tree job failed after both trees had compiled, because its CPU assertion counted compatible = 'arm,cortex-*' and the stock myron DTB uses compatible = 'arm,armv8', so the count was 0 and bash -e turned the grep exit status into a step failure; the assertion now counts device_type = 'cpu' nodes, which is the property that matters, and every grep -c in that job is guarded with || true because zero is a legitimate answer for several of them. (3) the patch-order step failed with FileNotFoundError on status.json: the file is written by the Report step, which sets working-directory: UniXNU, and every step is its own shell, so the next step started in the repository root and never saw it. (4) the merged-config check failed with IsADirectoryError on UniXNU/out/feeds/mu_basecore-8f10084c/.config, because find out -name .config matches both the config this board writes under out/myron and a DIRECTORY of that name inside the cached edk2 checkout; both consumers now search out/myron only and require -type f. (5) the first CI run failed with '.github/workflows/build.yml: update configuration findings or evidence with this change', which is the changed-area rule working as designed and is why this entry exists. The workflow is code that has to run, not configuration that can be reviewed into correctness.", "unixnu.lock IS FETCH OUTPUT AND MUST NOT BE EDITED BY HAND. The iOS 26 retarget changed board.os_profile, and unixnu.lock was then edited by hand to move only the xnu entry to the revision the new profile pins. That left eight more entries wrong: ArmCpu, XnuPrelink, DarwinBoot, ShengUfs, VirtioMmioBlock, VerifiedRoot and GopFramebuffer all still carried revisions from before the retarget, and RamBlock and AppleKeyStoreState were absent entirely because the arm64e OS profile selects them and the iOS 16 profile did not. CI caught it at Check the recorded source pins, which diffs the lock against what fetch resolves; the first difference reported was ShengUfs e2b32cc -> 2b6638be, and the rest were behind it. The lock is now regenerated from components.toml: all 11 selected components carry their catalog revision, and the 9 global feed pins this board does not use are unchanged. The rule for next time is to run unixnu fetch and commit its output rather than to patch one entry, which is also what the checker message says.", "PENDING.json HAD NO OWNING AREA. The record checker rejected a change to it with 'PENDING.json: add its owner area and paths to porting.toml'. The file has been in this repository since the iOS 16 skeleton and was never listed in any area paths, so every edit to it would have failed the same way. It belongs to configuration, which already owns board.toml, feeds.toml, unixnu.lock and .github/**, and is now listed there. Note that the checker distinguishes two failures: a changed file with an owning area needs a findings or evidence entry, while a changed file with no owning area needs its paths added. Both are the same rule seen from different sides.", "THE KERNEL JOB WOULD HAVE MISREPORTED ITS OWN EXPECTED STOP. Its failure path found no mach.development.bcm2837* file and immediately exited 1 with 'the kernel did not link', without looking at the log first. On this target that is exactly what the expected stop looks like: XNU 12377 compiles, the archives build, the link runs, and then kernel.py asks ipsw.py for the kernelcache and raises because no 23F84 restore image is present, which leaves no kernel file behind. The expected boundary would have been reported as a broken build on the first run that reached it. The branch now greps the log for the known missing-input messages before deciding, and treats a missing kernel plus one of those messages as the documented warning while still failing on anything else. The same set of messages is used in the after-link branch, so both paths agree on what the expected stop is. The decision table was checked against six cases: three forms of missing image with no kernel (all warning, exit 0), a real compile error with no kernel (failure, exit 1), a link followed by a prelink stop (warning), and a clean pass.", "THE SOC SERIES DOES NOT STACK ON THE ARM64E SERIES, AND THE FIRST GREEN KERNEL JOB WAS FALSE. The kernel job reported 'kernel build passed' on 2026-11-16 while its log held error: patch failed: pexpert/pexpert/arm64/board_config.h:134 and error: patch does not apply, for UniXNU-sm8550-common patches/xnu/native-smp-secondary.patch. The cause is a real conflict: bcm2837-machine-config.patch, the first patch of the arm64e arch series, inserts an ARM64_BOARD_CONFIG_BCM2837 block into board_config.h at line 304, which moves the context the SoC patch edits at line 134. The patch is also superseded: it raises MAX_CPUS from 4 to 8 while leaving MAX_CPU_CLUSTERS at 1, and the arch block already sets MAX_CPUS 8 with MAX_CPU_CLUSTERS 2, which is what SM8850 has with its two clusters. board.toml now names the second SoC patch, sheng-platform-power.patch, by path instead of using the soc: prefix, so the conflicting one cannot come back through a SoC repository change; that patch only calls sheng_pmgr_run under XNU_SHENG_PMGR, which is n here. The false green had a separate cause worth remembering: the job ran the build as if unixnu build kernel pipe tee build.log then, which tests the exit status of tee rather than of unixnu, so a nonzero build with a successful tee took the success branch. It now takes PIPESTATUS from both invocations, sets pipefail, and fails by name when the log contains a patch that did not apply. The SoC patch count assertion moved from 2 to 1, and a negative assertion keeps native-smp-secondary out of the order.", "A patch_series ENTRY MUST BE A SERIES FILE, NOT A PATCH. Having decided to drop native-smp-secondary.patch, the next attempt named the other SoC patch directly in kernel.patch_series as soc:patches/xnu/sheng-platform-power.patch. CI rejected it with /patches/xnu/sheng-platform-power.patch:1: patch missing: .../sheng-platform-power.patch/diff --git a/bsd/kern/bsd_init.c, which reads oddly until one sees the cause: patches.plan resolves each patch_series entry to a series FILE and then reads every line of it as a patch path. Pointing it at a .patch makes it iterate the patch body, so the diff header becomes a 'path' relative to the patch. The SoC patch is now listed in patches/xnu26/series instead, which is what that device series exists for, and kernel.patch_series lists only the three real series files. Resolving the order now gives 69 arch + 1 os + 1 SoC = 71 patch paths, and both CI assertions were rewritten for that shape: shared >= 68, exactly one SoC patch, sheng-platform-power present, native-smp-secondary absent.", "THE DEVICE SERIES MAY ONLY NAME FILES THAT LIVE IN THIS REPOSITORY. Listing the SoC patch as soc:patches/xnu/sheng-platform-power.patch inside patches/xnu26/series satisfied the driver, which understands the soc: prefix, but failed check-repository.py with 'patches/xnu/series: patch file missing: soc:patches/xnu/sheng-platform-power.patch', and CI also showed the patch order assertion failing on the same cause. check-repository.py validates every line of a device: series with (series.parent / line).is_file(), so a quoted entry has to be a real path relative to the series file inside this repository; a driver-only prefix is not. Trying a ../../../../UniXNU-sm8550-common relative path fails the same check, because that sibling checkout does not exist when the repository is checked out on its own. The patch is therefore vendored: patches/xnu26/sheng-platform-power.patch is a byte copy of the SoC one, and the device series names it by bare filename. Both checks now pass locally with the same scripts the CI runs, and resolution gives 71 patch paths (69 arch + 1 os + 1 device).", "VENDORING THE SOC PATCH MOVED IT OUT OF THE SOC COUNT. After the patch was copied into patches/xnu26/, CI reported patch count 71, which is correct, and then failed the assertion that required exactly one UniXNU-sm8550-common entry: the vendored copy resolves from the device series, so no entry in the order carries the sm8550-common path any more, and the SoC count became 0 while the patch was still present by name. Counting where a patch comes from and requiring that a specific patch is present are two different facts once a copy exists, so both assertion blocks now check the total instead: exactly 71 patch paths, at least 68 from the shared xnu-12377 tree, sheng-platform-power.patch present by name, and native-smp-secondary.patch absent. Verified locally against the real series files: 71 paths, 70 shared, sheng present, smp absent.", "THE OS SERIES MUST STAY LAST. Adding the device series after os: so that the vendored SoC patch would resolve moved sheng-platform-power.patch to the end of the order, and CI failed on the assertion that the final patch is zzz-boot-progress.patch with AssertionError: sheng-platform-power.patch. The zzz prefix on that patch is deliberate: it is the boot progress layer and has to be applied after everything it reports on. The device series now sits between arch: and os:, so the order is arch (69) + device (1) + os (1) = 71, with bcm2837-machine-config.patch first, sheng-platform-power.patch at index 69, and zzz-boot-progress.patch last. Verified locally against the real series files.", "THE KERNEL ORDER APPLIES CLEANLY AND THE COMPILE STOPS ON A TOOLCHAIN INTERFACE. CI run 0b65bc3 built the Linux toolchain from source, applied all 71 patches with no failure including the vendored sheng-platform-power.patch and zzz-boot-progress.patch last, and then failed in scripts/build-firehose.sh with sys/ucred.h:164:20 __ptrauth qualifier must take between 1 and 3 arguments, expanded from OS_PTRAUTH_SIGNED_PTR_AUTH_NULL in libkern/os/base.h:355. XNU 12377 writes that macro with four __ptrauth arguments; the clang that setup-toolchain.py builds (swift-6.4.0-RELEASE LLVM, commit 58c46bae, patched for __builtin_xnu_type_ only) takes at most three. No patch in the xnu-12377 series touches that header or macro, so it is a source to toolchain mismatch rather than a board setting, and the public hakios-arm64e-dada port reports the identical error on the same XNU tag in its issue 4, which is what makes it a finding rather than a local mistake. Two options and why neither is applied: build the toolchain clang with four-argument support, which is correct and is the larger job, or drop the authenticates-null-values argument in os/base.h under this toolchain, which is one line but changes the semantics of every null-authenticating data pointer in the kernel. Separately worth recording: the 71-of-71 clean patch application is the first time the full arm64e plus device order has been exercised end to end, and it is independent of the compile failure.", "THE PTRAUTH WALL IS CLOSED BY TEACHING THE TOOLCHAIN, NOT BY PATCHING XNU. scripts/linux/llvm-ptrauth-null-values.patch is a copy of the patch the kernel job now applies to llvm-project before building clang. It touches three files and 20 lines: ParsePtrauthQualifier in clang/lib/Parse/ParseDecl.cpp now accepts up to four arguments instead of three, the diagnostic in DiagnosticParseKinds.td says so, and HandlePtrAuthQualifier in clang/lib/Sema/SemaType.cpp reads the fourth argument, requires it to be the string literal 'authenticates-null-values', and passes it to PointerAuthQualifier::Create instead of the hardcoded false. That last part is what makes this the correct fix rather than a workaround: AuthenticatesNullValues already exists end to end upstream - a bit in PointerAuthQualifier, a field in CGPointerAuthInfo, an argument to Create, and consumers in CodeGen and DebugInfo - so only the parser and Sema needed teaching. Dropping the argument in XNU os/base.h was rejected for the reason recorded earlier: it changes the semantics of every null-authenticating data pointer in the kernel. The workflow copies the patch into UniXNU/scripts/linux/ and appends one run() line to setup-toolchain.py beside the existing llvm-xnu-builtin-type.patch application, which keeps the change inside this repository instead of forking UniXNU. Verified that the two patches do not overlap: the existing one touches nine files, this one three, intersection empty, and this patch applies cleanly to a pristine checkout of LLVM commit 58c46bae with git apply --check. The step is ordered before the toolchain cache restore so the changed scripts/linux hash misses the cache that has no patch.", "scripts/linux/ HAD NO OWNING AREA. The record checker rejected the toolchain patch with 'scripts/linux/llvm-ptrauth-null-values.patch: add its owner area and paths to porting.toml'. That directory holds the patches and shims this board contributes to the toolchain build, so it belongs to configuration alongside board.toml, configs/** and .github/**, and is listed there now. This is the third time the same rule has bitten in this migration - PENDING.json, then scripts/linux - which suggests the initial area paths were written for the iOS 16 shape of the repository and never audited against the files that were added after it.", "THE FIRST VERSION OF THE TOOLCHAIN PATCH DID NOT COMPILE, AND CI SAID SO PRECISELY. Building clang failed with 'no member named err_ptrauth_qualifier_bad_arg_count in namespace clang::diag' at the line the patch added to SemaType.cpp. That diagnostic exists only in DiagnosticParseKinds, which is the parser domain; Sema may not use it. The patch now raises diag::err_attribute_wrong_number_arguments, which is defined in DiagnosticSemaKinds and already used eleven times in SemaType.cpp, with the argument list << Attr << 4 matching its percent-zero-attribute percent-one-arguments signature. Worth recording because it is the kind of mistake that a patch applying cleanly says nothing about: git apply --check passed both before and after, and only a real compile separated the two. The lesson for the rest of this port is that a toolchain patch has to be built, not just applied.", "THE PTRAUTH EXTENSION NEEDED FOUR FILES, NOT THREE, AND THE SECOND LIMIT WAS IN TABLESGEN. With the parser and Sema changes in place the error changed from '__ptrauth qualifier must take between 1 and 3 arguments' to '__ptrauth attribute takes no more than 3 arguments'. That message comes from err_attribute_too_many_arguments, raised by ParsedAttr::checkAtMostNumArgs against the argument count TableGen derives from the attribute definition, not from hand-written code. The cap is def PointerAuth : TypeAttr in clang/include/clang/Basic/Attr.td, whose Args list held exactly three entries: Key, AddressDiscriminated and ExtraDiscriminator. A fourth optional StringArgument<'AuthenticatesNullValues', 1> is now declared there, so TableGen permits four and the custom handler still reads the arguments through the generic getNumArgs and getArgAsExpr - verified that HandlePtrAuthQualifier references no generated accessors, so adding the parameter cannot break it. The patch is four files and 25 added lines. This is the third distinct layer that rejected the syntax: parser count check, TableGen argument cap, and Sema diagnostic domain. Each was invisible until the previous one was fixed, which is the argument for keeping the whole change as one reviewed patch rather than three quick edits.", "NATIVE_AES IS MANDATORY ONCE VIRTIO_BLOCK IS SELECTED, AND NO FRAGMENT PROVIDES IT. After the ptrauth work the kernel build finally got past libdispatch - libfirehose_kernel.a built as arm64e, which is the direct evidence that the toolchain patch works - and then stopped on 'NativeVirtioBlock currently requires the qualified NativeAES/original-storage prelink baseline'. scripts/build-xnu-4k-baseline.sh enforces a chain: XNU_NATIVE_VIRTIO_BLOCK needs XNU_NATIVE_AES, and XNU_NATIVE_AES needs CRYPTO_BOOTSTRAP=prelinked together with XNU_SOURCE_CORECRYPTO14. The device defconfig set VIRTIO_BLOCK but never AES, because profiles/arch/arm64e/configs/common.config has seven switches and AES is not among them and sm8550.config is a single NATIVE_ADRENO line, so the switch had to come from here and did not. CONFIG_XNU_NATIVE_AES=y is now set, and the inherited bootstrap mode plus the arch fragment satisfy the other two conditions without further overrides. This is why the port cannot copy UniXNU-sheng wholesale: sheng sets neither AES nor VIRTIO_BLOCK and can therefore use the source bootstrap, while this board needs the virtio transport and must stay prelinked. PENDING: whether that prelinked crypto closure is complete for myron is unverified, and it is the next thing expected to break.", "THE LINK FAILURE WAS ONE MISSING SWITCH, AND THE ARCHIVES WIRE THEMSELVES. The kernel compiled fully and failed at the link with four undefined symbols: _source_corecrypto14_original and _source_corecrypto14_start_once from OSKext::start, plus the profile-runtime pair. The cause is narrow and worth recording precisely. Those two are defined in osfmk/prng/prng_random.c under #if defined(XNU_SOURCE_CORECRYPTO14). In prelinked mode build-xnu-4k-baseline.sh compiles that one object with prng_random.o_CFLAGS_ADD=-UXNU_SOURCE_CORECRYPTO14, which removes the definitions, while OSKext.cpp keeps the same #if and is not compiled with the -U, so it still references them. The archives that satisfy the reference are attached automatically: lines 697 and 704 of the script set AES_ARCHIVE and VIRTIO_ARCHIVE with exactly the default paths this board needs (build/software-aes/libSoftwareAES.a and build/virtio-mmio-block/libVirtioMmioBlock.a), guarded by XNU_NATIVE_AES and XNU_NATIVE_VIRTIO_BLOCK. The failed run had NATIVE_AES at 0, so neither guard fired and neither archive was linked. Setting NATIVE_AES fixes the link without touching the build script. The three archive variables are now declared explicitly as well, which is redundant against the script defaults but pins the paths the catalog publishes, and makes the dependency visible to anyone reading the defconfig rather than only to someone reading line 698 of a shell script. Verified: all three build guards pass for this combination, and the component build list, the catalog output paths and the configured archive paths agree.", "THE VIRTIO TRANSPORT IS DROPPED BECAUSE PRELINKED CANNOT BUILD THIS TREE. The link failure was not a missing archive after all: build-xnu-4k-baseline.sh attaches the crypto, AES and virtio archives only under [ '$BOOTSTRAP' = 0 ], and the failing pass is the bootstrap one, whose job is to produce the compile records and kernel headers. In prelinked mode that pass also compiles prng_random.c with -UXNU_SOURCE_CORECRYPTO14, which deletes the definitions of source_corecrypto14_original and source_corecrypto14_start_once, while OSKext.cpp keeps the same #if and is not compiled with the -U, so it still references them. The bootstrap pass therefore cannot link, and it dies before writing startup.o.json or kern/clock.h, which are exactly the two artifacts the driver needs in order to tolerate that failure. NATIVE_VIRTIO_BLOCK forces NATIVE_AES, and NATIVE_AES forces prelinked, so the whole chain had to go: AES and VIRTIO_BLOCK are now off and the bootstrap mode is source, which is what UniXNU-sheng uses on the same XNU tag and SoC family. Source mode compiles prng_random.c without the -U, so the two symbols exist in every pass and the ordering trap is gone. The cost is the virtio block transport only; the root volume and Data region live on UFS, and XNU_NATIVE_UFS keeps its own archive and consults neither switch. All nine guards in the build script were simulated against this combination and pass. If the virtio transport is ever wanted back, the fix belongs upstream: either attach the crypto archive in the bootstrap pass too, or guard OSKext references with the same -U the prng object gets.", "THE SOURCE-MODE SWITCH NEVER REACHED THE BUILD THE FIRST TIME. The previous run still failed on the same four undefined symbols even though the defconfig had been switched to source, and the cause was in this repository: when the AES/virtio explanation block was rewritten, CONFIG_XNU_CRYPTO_BOOTSTRAP='source' was dropped from the file and only its surrounding prose survived. os:configs/ios.config still supplied 'prelinked', nothing overrode it, and the build behaved exactly as before. CI caught it directly - the resolver prints every configured value and then compares them, so the log showed 'XNU_CRYPTO_BOOTSTRAP = prelinked' next to 'error: XNU_CRYPTO_BOOTSTRAP: is 'prelinked', expected 'source''. That assertion exists because of this class of mistake and it earned its place here. The defconfig is now rewritten whole rather than patched in place, with the three stale AES/prelinked comment blocks removed along with the two archive pins that only belonged to the prelinked configuration. Verified by re-implementing the merge the driver performs - arch fragment, SoC fragment, OS fragment, device defconfig last, last value wins - and checking that all five load-bearing switches resolve as intended. The lesson is that a config file edited by regex replacement has to be re-read whole afterwards; the prose and the switches drifted apart silently.", "SOURCE MODE BUILT THE BOOTSTRAP PASS - 942 COMPILE RECORDS - AND THEN FAILED ON A COMPONENT BOOKKEEPING GAP. With the bootstrap mode actually reaching the build, the first pass compiled and wrote 942 .o.json records, which is the artifact the driver needs to tolerate a bootstrap link failure, and prepare-storage-headers ran. The build then stopped with 'unixnu: [kernel] archives needs component entries for: AppleKeyStoreState, RamBlock'. The driver requires an archive build entry for every selected component whose catalog entry is build_stage = kernel with a non-empty build list, and both of those were added to components.include during the arm64e migration without being added to kernel.archives. They are now listed, in catalog order after ShengUfs. VirtioMmioBlock was removed from components.include at the same time rather than given an archive entry: its switch is off for the reason recorded above, so building its archive would produce an object nothing links. ShengUfs does not depend on it, verified from the catalog dependencies field. The completeness relation - selected component, stage kernel, has build entry, is covered by a component: entry in kernel.archives - is now checked by a script that reproduces the driver rule, not by eye.", "THE ARCHIVE REPLAY IS STRICTER THAN THE KERNEL AND THAT ONE DIFFERENCE STOPPED THE BUILD. With source mode working, the run compiled the two corecrypto archives successfully (529 kernel C sources each, 0 failures) and then failed on the first driver archive, ArmDTPlatform, with clang-24: error: overriding -mios-version-min=26.0 option with --target=arm64e-apple-ios17.0.0 [-Werror,-Woverriding-option]. scripts/build-arm-driver.py replays a per-object compile recipe out of the XNU build, deliberately filters every -W flag out of it so the replayed command cannot weaken the checks, and then appends its own strict list ending in -Werror. The recipe carries the kernel -mios-version-min while the script also passes --target with a shorter iOS version, and the clang this job builds reports that override as a warning. The kernel build itself hits the same diagnostic 1156 times and continues, because it runs with BUILD_WERROR=0. So the difference is not the compiler disagreeing with itself: it is that the replay applies -Werror to a command it did not fully author. Only that single warning is downgraded, by adding -Wno-error=overriding-option beside the -Werror the script sets; every other warning stays an error, which is the point of the list. The alternative of stripping -mios-version-min from the recipe was rejected because it changes the target platform version the object is built for rather than how a known-benign diagnostic is treated. Verified by applying the same edit to a fresh copy of the script and confirming the file still parses and the flag sits where intended.", "THE ARCHIVE BUILDERS GET A DIFFERENT ENVIRONMENT THAN THE KERNEL AND THAT IS WHERE THE DEPLOYMENT MISMATCH COMES FROM. The -Wno-error downgrade worked: ArmDTPlatform compiled, and the job stopped one step later in the object audit with 'ArmDTPlatform: deployment (2, 1114112), expected (2, 1703936)' - iOS 17.0 built against an iOS 26.0 expectation. The audit is scripts/kernel_target.py, which derives both the target triple and the expected deployment from UNIXNU_XNU_ARCH and UNIXNU_IOS_VERSION and falls back to arm64 and 17.0 when they are absent. scripts/unixnu/kernel.py sets those two only in version_env(), which the kernel invocation gets; build_archives() is handed xnu_env(), which carries only the CONFIG_XNU_* to XNU_* switches and no profile version at all. So every archive builder runs with the arm64/17.0 defaults, compiles objects stamped for iOS 17.0, and fails the very audit that would have caught it. This is an upstream defect rather than a board setting: nothing in board.toml or the defconfig can influence it, because the value never reaches the script. The fix is to pass version_env() into build_archives as well, or to export the two variables for the whole kernel step. Not applied here - the run predates this note and the next commit should carry the change with the reasoning above. Note that the earlier plan of stripping -mios-version-min from the replayed recipe, which was rejected then, would have masked exactly this: the object really was being built for the wrong platform, and only the audit said so.", "THE DEPLOYMENT MISMATCH WAS A HARDCODED iOS 17 CROSS TARGET, NOT A MISSING ENVIRONMENT VARIABLE. Yesterday I recorded that build_archives() never received UNIXNU_IOS_VERSION; reading kernel.py properly the next morning showed that was wrong - build() assembles one env with linux_env(), xnu_env() and version_env() and hands that same env to build_archives() at line 224, so the version does arrive and the audit expectation of (2, 1703936) was computed correctly. The fault is a few lines earlier. linux_env() hardcodes, for UniXNU default target, 'UNIXNU_SDK_VERSION': '17.0' and 'DARWIN_TRIPLE': 'arm64-apple-ios17.0'. scripts/linux/clang prepends -target $DARWIN_TRIPLE to every invocation, archive replays included. The kernel itself survives that because its makefiles also pass -miphoneos-version-min=26.0 and the version arg simply wins over the triple - the log shows 1160 warnings to that effect and no errors. The archive replay carries the same -miphoneos-version-min but the script strips every -W flag, not the deployment min, so the object is linked for whatever the triple says: iOS 17.0. Hence an object built 17.0 against a 26.0 audit. The fix inserts a CI step that rewrites both hardcoded values from the selected profile - os.arch and os.ios_version - before the build, so the triple becomes arm64e-apple-ios26.0. The arch half is not cosmetic: leaving the triple at arm64 would strip the pointer-authentication ABI that the arm64e series depends on. Verified end to end against a staged copy of the upstream script: the profile resolves to arm64e/26.0, the patched file still parses, and the resulting triple matches the deployment the audit expects. Lesson repeated from two days ago: do not record a root cause from partial reading of a function; the wrong note cost a morning and would have sent the next session to edit the wrong line.", "THE CROSS-TARGET FIX WORKED AND EXPOSED A TRANSCRIPTION ERROR IN THE ROOT HASHES. Four components now report 'arm64e-apple-ios26.0 object audit passed' - ArmCpu, ArmDTPlatform, SoftwareAES and VirtioMmioBlock - so the deployment mismatch really was the hardcoded iOS 17 triple and nothing else. The build then reached ShengUfs and stopped with 'no policy directory for 23F84', which is a legitimate input requirement rather than a defect: build-sheng-source-storage.py wants the signed root-policy headers under scripts/policies/*<build>. UniXNU-sheng ships exactly that directory for ipados-26.5.2-23F84, and its values identify the same images this board targets - volume UUID 546DFF4A-4172-4026-9F1B-7FDAD45F3D2E and 7A23BAC7-E86D-4DF4-B181-E6D80F212AE5, image sha256 b4e40913...7716 and eadb838d...3daf, all matching this repository os-profile field for field. The files are therefore the same signatures, not another device borrowed to silence a check, and they are copied in as ios-26.5.2-23F84. Copying them surfaced something worth having found: this profile systemos_image_sha256 had 65 characters, with a stray 9 inserted at offset 33 (e9367c90e916f02 instead of e9376c90e16f02). The policy verification refused it, which is the first time anything compared that field against an independent source; every earlier check had only ever compared the repository against itself. Corrected, and a repository-wide sweep now asserts that every *sha256 field in every toml and json file is exactly 64 hex characters so a typo of this kind cannot sit undetected again. The lesson: self-consistency checks cannot catch a transcription error in a constant that is only used as a constant.", "THE POLICY HEADERS NEED THE USERDATA TABLE MODE, AND SHENG 26 DOES NOT SET IT. build-sheng-source-storage.py has two ways to read a policy. With XNU_SOURCE_STORAGE_TABLES=userdata it reads manifest.header.bin, the 544-byte signed header, and checks bytes 56 to 88 against the profile image sha256; without that switch it reads a full manifest.bin per window. UniXNU-sheng ships only manifest.header.bin for 26 and sets the switch only in its 27 and macos configs, so its 26 profile cannot pass this step either - an upstream gap rather than a board setting. The script gives the reason itself: a bring-up image can carry one policy because the boot image must stay under the 192 MiB fastboot limit and the second table does not fit yet. So the switch is set here, and the headers are used in header mode. This also confirms the earlier hash correction independently: both manifest.header.bin files have their bytes 56 to 88 equal to the profile digest, including the SystemOS value that had the stray 9. Had the typo stood, this check would have rejected a header that is provably correct. The adapter writes build/sheng-ufs/libShengUfs.a, which is what the catalog declares and what the defconfig archive entry names. All ten guards in the build script were simulated against the resulting switch set and pass; the four XNU_SOURCE_STORAGE conditions are all of the form 'not set means error', so setting it only widens what is accepted.", "THE STORAGE ADAPTER CALLS ITS OWN HEADER MODULE WITH A STALE REVISION, SO THE PIN CHECK BLAMES THE REPOSITORY FOR A VALUE IT NEVER CHOSE. With the userdata table mode set, the policies were accepted and the run advanced to 'feeds/IOStorageFamily-67f9003c: expected full commit 7edb88fbae296fb7c8ce2f64e115e116e566d51c, found e45fbe30a7879e0b16e26dddb78538f1b00e0bff'. Three facts settle which side is wrong. scripts/prepare-storage-headers.py defines LEGACY_REVISION = e45fbe30a7879e0b16e26dddb78538f1b00e0bff, UniXNU feeds.toml pins IOStorageFamily to that same e45fbe30, and this board unixnu.lock - regenerated from feeds.toml, not hand written - carries e45fbe30 as well. The 7edb88fb literal exists only in one place: scripts/build-sheng-source-storage.py passes it as an argument to headers.prepare(). Because it is an argument it also defeats that module own UNIXNU_IOSTORAGEFAMILY_COMMIT override, so the environment cannot correct it either. It is a UniXNU-sheng pin baked into a shared script after the trunk moved on. The CI step passes headers.LEGACY_REVISION instead of the literal, which makes disagreement between caller and callee impossible: if upstream repins the family, both move together. Verified by applying the edit to a fresh copy of the script - the file still parses and the call now reads headers.LEGACY_REVISION. Also worth recording how this failure was correctly attributed: had unixnu.lock been hand-maintained the obvious reading would have been a stale lock, and the fix would have been to edit the lock to match the script, which would have been backwards.", "THE STORAGE ADAPTER IS THE ONE ARCHIVE BUILT FROM DEVICE SOURCES, AND THIS REPOSITORY HAD NONE. With the headers revision corrected the run advanced and failed with 'BootLog.c not found under the device or build tree'. build-sheng-source-storage.py does not compile a kit: it compiles the board own driver sources, resolving each name through device_source() which searches the device package/ directory, kits/sheng and the tree. UniXNU-sheng keeps those under package/ at its repository root, 209 files in all, and this port had only package/unixnu.toml - the UEFI boot menu - so every lookup failed. Reading the script rather than copying the tree gives the exact set for this profile: the always-compiled five are SourceStorage.cpp, SourceRootPolicies.cpp, SourceRootBinding.cpp, BootLog.c and BootReset.c; everything guarded by UNIXNU_IOS_VERSION >= 27 (BootProcessProbe, BootUiTraceProbe, BootProcessWorker, BootWatchdogPolicy, BootDiagExport, WifiFirmware, BluetoothFirmware) is not used on 26. Those five pull in eight quoted headers, six of them in the same package/ and two - verified_root.h and VerifiedBlockPolicy.h - from the VerifiedRoot kit. VerifiedBlockPolicy.h is worth calling out: neither UniXNU-sheng nor UniXNU ships it anywhere, yet SourceRootPolicies.cpp includes it, so sheng 26 profile cannot pass this step either. The copy used here comes from UniXNU-Pagani-Drivers and was accepted only after checking the interface: the header declares verified_root_policies and verified_root_policy_count and the source defines both, and its NativeVerifiedBlockPolicy fields manifest and manifestBytes match the aggregate initialisation at line 79. Thirteen files now sit in package/, verified present and include-closed by script. Two more upstream inconsistencies surfaced around the same step and are handled separately: the adapter is registered in kernel.archives with an explicit --policy-dir, which is how sheng avoids the profile-vs-feeds pin disagreement entirely.", "THE STORAGE ADAPTER IS THE ONE RECIPE THAT READS DEVICE FILES AND IT IGNORES THE VARIABLE THAT TELLS IT WHERE THEY ARE. After the thirteen driver sources were added to package/, the run still failed on 'BootLog.c not found under the device or build tree', and the files were verifiably present at the run head sha, so the lookup path itself was wrong. scripts/unixnu/kernel.py sets UNIXNU_DEVICE for every archive recipe; build-sheng-source-storage.py never reads it and instead does device = (args.device or tree).resolve(), so with no --device argument it searches the build tree. The build tree carries package/ as a symlink to whichever module UniXNU registered, not this repository package/, and device_source() therefore never sees the files. Every other consumer of device paths is reached through that variable, which is why only this recipe broke. The adapter now reads UNIXNU_DEVICE when --device is absent, falling back to the old behaviour. I first tried adding --device {tree}/.. to the board archive line and reverted it before committing: the tree lives at UniXNU/out/<device>/<profile>/<board>/tree, so its parent is a UniXNU output directory and not the device repository at all. That would have been a plausible looking edit that failed identically, which is worth recording because the placeholder names in kernel.py make {tree}/.. look meaningful. Verified on a staged copy: os and Path are both imported, the patched file parses, and the new line reads exactly the variable the caller sets.", "THE DEVICE FIX WORKED, AND IT UNCOVERED A SECOND PATH THAT HAD BEEN ACCIDENTALLY CORRECT. After the adapter started honouring UNIXNU_DEVICE the failure moved from 'BootLog.c not found under the device or build tree' to 'no such file: .../myron-ios26/drivers/ShengUfs/NativeUfs.cpp'. Reading line 203 shows the source list mixes two different roots: ROOT / drivers/RamBlock/... is right because RamBlock is a UniXNU submodule listed in .gitmodules, while device / drivers/ShengUfs/NativeUfs.cpp only ever resolved because device used to alias tree. ShengUfs is not a submodule: it is a catalog component linked into the assembled tree at drivers/ShengUfs, so the path belongs to tree. Correcting device to mean the real device repository therefore had to come with a second edit, and the two are one change, not two. Two dead ends are worth recording. Adding --device {tree}/.. to the board archive line looked natural and is wrong: the tree sits at UniXNU/out/<device>/<profile>/<board>/tree, so its parent is a UniXNU output directory. And adding --tree {tree} to that same line fails differently, because archive_plan classifies any entry that does not start with component: as a script and only the component branch substitutes {tree}; the literal string would have reached argparse. Both were reverted before pushing. The adapter needs neither: tree.py copies the device scripts/ into the assembled tree, so the script really does run from <tree>/scripts and its ROOT default already equals the tree. Verified by applying both edits to a staged copy - the file parses, line 74 reads UNIXNU_DEVICE, line 203 reads tree.", "THE STORAGE ADAPTER NOW COMPILES, AND THE HEADER I BORROWED EARLIER WAS THE WRONG ONE. With both path fixes in place the adapter reached clang and failed inside SourceRootPolicies.cpp with four errors, all of the same shape: verified_root_policies redefined as NativeVerifiedBlockPolicy[16] against const NativeVerifiedBlockPolicy[], verified_root_policy_count redefined without const, then the two assignments that follow. The cause was my own choice two steps back. I had taken VerifiedBlockPolicy.h from UniXNU-Pagani-Drivers, which declares both symbols const and names the struct fields manifest and manifestBytes. SourceRootPolicies.cpp defines those symbols itself and initialises them as {bytes + offset, size}, so it pairs with the version that declares no extern symbols at all and names the fields bytes and size. That version is in UniXNU-muyu package. Checked before swapping: the header now has no extern declarations, the struct fields are const uint8_t *bytes and uint64_t size, the source defines the array and the count, and line 79 assigns exactly two values in that order. Picking a header by filename and by whether the symbol names appear is not enough - two repositories ship incompatible definitions of this same file, and the only reliable test is matching it against the consumer definition site rather than the producer expectations."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
