result = "Builds the writable Data seed for --data-ramdisk from the iOS 16.5 OS volume on macOS: an APFS OwnerData volume at the size asked for, holding the volume's initial /private/var without staged_system_apps, packed with DarwinBoot's DBRDISK1 writer so only the non-zero pages travel. UniXNU's own prepare-owner-data-fixture.py and seed-data-grow.py cannot do it: the first rejects any OS mount whose sbin/launchd does not hash to the iPadOS 17.7.11 image and the second grows a packed seed this port does not have. .github/workflows/data-seed.yml runs it on a hosted macOS runner and reports the new volume UUID. Several runs failed before it produced anything, and job logs need repository access, so each was diagnosed from the run page annotations instead: a cache key holding a comma, tee masking the exit code, a 32 MiB container grown rather than created at size, a missing DarwinBoot submodule, Path.symlink where the method is symlink_to, and a log redirect into a directory that did not exist yet. scripts/test_build_data_seed.py covers the copy, the tree measurement, the mount checks and the container check, which is everything that runs without hdiutil"

