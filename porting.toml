[[area]]
id = "packaging"
status = "host-verified"
components = ["XnuPrelink"]
paths = ["scripts/*payload*", "scripts/*image*", "scripts/*flash*", "patches/**", "package/Kit.toml", "package/**", "os-profiles/**", "scripts/extract-ipsw-pins.py", "docs/**", "scripts/compile-records.py", "scripts/*prelink*", "scripts/build-*.py"]
inputs = ["XNU 8796.101.5 at revision aca3beaa3dfbd42498b42c5e5ce20a938e6554e5, the open-source drop closest to Darwin 22.5.0.", "iOS 16.5 restore image for iPhone10,3, build 20F66. Several profile fields are read out of it and are still marked REQUIRED_IPSW.", "Android 14 boot image format: header version 4, 4096-byte pages, kernel base 0x0, LZ4 ramdisk."]
configuration = ["board.os_profile = ios-16.5-20F66; the profile is os-profiles/ios-16.5-20F66/profile.toml and must land in UniXNU/profiles/os/ before a build resolves.", "kernel.prelink is inherited from the OS profile: tool kits/XnuPrelink/emit_prelink.py, slide -0x1000000, and kernelcache_sha256 and early_security_init are REQUIRED_IPSW.", "kernel.config_fragments apply arch:configs/common.config, soc:configs/sm8550.config and os:configs/ios.config, then the device defconfig.", "patch_series resolves arch, soc, os, device in order; the OS series is empty and the device series carries no board patch yet.", "[bootimg.image] base = 0x0, pagesize = 4096, header_version = 4.", "package/unixnu.toml defines the payload menu with a single xnu entry."]
procedure = ["Read https://unixnu.com/xnu/source-and-patches, https://unixnu.com/concepts/prelink and https://unixnu.com/concepts/payload.", "Run python3 scripts/extract-ipsw-pins.py iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw to reproduce every pin in the OS profile, including the ADT identity from the board device tree.", "Fill payload.text_fixups from the OS image dyld cache once native-text-fixup.patch is rebased onto xnu-8796.", "Rebase the arch, soc and XnuPrelink patch series onto xnu-8796 before referencing any of them from the OS series, then build kernel, package, firmware and payload in order.", "After changing boot arguments, rebuild both the payload and the boot image as described in https://unixnu.com/xnu/boot-arguments#apply-arguments.", "Run python3 scripts/porting-record.py check --device . from the UniXNU checkout before publishing."]
findings = ["XNU 8796 is the iOS 16 kernel. The 8796 train has three open-source drops, 8796.101.5, 8796.121.2 and 8796.141.3; 8796.101.5 is the earliest and the closest to Darwin 22.5.0, so it is the baseline for iOS 16.5. The community iOS 16 ports, dipa-studio/ios-sweet and the ios-topaz family, build the same train.", "osfmk/conf/files.arm64 lists osfmk/arm64/kpc.c as optional kpc nos_arm_asm, but the file is not in the xnu-8796 source drop; only kern/kpc_common.c, kern/kpc_thread.c and x86_64/kpc_x86.c are published. Removing the entry is not enough: cpu.c calls kpc_idle and kpc_idle_exit and kpc_common.c calls the arch hooks, so the link then fails on eight _kpc_* symbols. xnu-8796-arm64-kpc-backend.patch provides the backend instead, reporting no counters and nothing running, which is what kpc_common.c asks before it reads anything.", "The iig interface generator is newer than this XNU. It emits rpc.kernelContent, reads it back as IORPCMessage * and initialises it with the kernel-resident message, while IORPC in xnu-8796 has only message, reply, sendSize and replySize. Adding IORPCMessage * kernelContent to the struct satisfies the generator; the 8796 dispatch path reads message only and ignores the field.", "The first kernel build reached the XNU compile and stopped on a single cause repeated four times: clang rejects -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang, which makedefs/MakeInc.def adds beside -ftrivial-auto-var-init=zero. That companion flag was removed from clang. linux-clang-auto-var-init.patch drops it and keeps -ftrivial-auto-var-init=zero, which is the supported way to get the same zero-initialisation. The patch is last in the series so it cannot collide with the other MakeInc.def edits.", "The second build stopped on uio_stackbuf_t, which bsd/sys/uio_internal.h declares as char aligned to union iovecs and then places in arrays sized by UIO_SIZEOF. Upstream clang rejects an array whose element size is not a multiple of its alignment; Apple's clang accepts the idiom. linux-clang-uio-stackbuf-align.patch moves the alignment to the array declarations and leaves the typedef as plain char, so sizeof stays 1 and UIO_SIZEOF still counts bytes. Verified on Ubuntu clang 18.1.3: the element is 1 byte, the buffer keeps its byte count, and the array is 8 byte aligned.", "zzz-boot-progress.patch inserted its boot_progress_user_abort call between two lines of handle_kernel_abort's parameter list, which is a syntax error wherever that signature appears. Verifying a fuzzy application by comparing the added and removed lines caught nothing, because the change set was identical and only its placement was wrong. Comparing what changed is not enough; a re-anchored hunk needs its placement checked too. The call now goes at the top of the body, matching the other boot_progress hooks.", "KALLOC_TYPE_IS_COMPATIBLE_PTR takes the pointee type with __typeof__(*(ptr)). In C++ that is ill formed for a void pointer, which the macro explicitly documents as a wildcard, so any C++ translation unit that frees a void pointer fails. __builtin_choose_expr does not help: clang still diagnoses the unselected branch. linux-clang-kalloc-pointee-type.patch derives the pointee type from the pointer type with a template in C++ and keeps the deref in C.", "The kernelcache pin covers the decompressed arm64 slice, not the whole fat image. scripts/unixnu/ipsw.py takes the IMG4 payload, LZFSE-decodes it, then keeps the single 0x0100000c fat slice and hashes that; hashing the fat image gives a different digest and fails the board pin check. scripts/extract-ipsw-pins.py mirrors that pipeline exactly.", "The prelink ABI is version bound and was read out of the 16.5 kernelcache rather than copied: AppleMobileFileIntegrity sits at 0xfffffff004e2b640 here against 0xfffffff005ab4ae0 in the 17.7.11 profile, and com.apple.iokit.IOHIDEventDriver, which the 17.7.11 roots list keeps, does not exist in this kernelcache at all.", "The ADT identity comes from the real board device tree, Firmware/all_flash/DeviceTree.d22ap.im4p inside the restore image, not from libMobileGestalt and not from another profile. That tree gives product-id fd079b298144a7deb4d7c87fef3eb474d8f0e7eb and corrects three values that would otherwise be inherited from the iPadOS profile: artwork-device-subtype is 2436 rather than 2732, compatible-device-fallback is iPhone9,2 rather than iPhone10,6, and kern.maxvnodes is 10000 rather than 66560.", "The Apple device tree length field carries a flag in its high bit; the real length is the low 31 bits. Reading it unmasked overflows the parser.", "The rebase is complete and verified: all 59 patches apply strictly, in order, onto xnu-8796.101.5. 54 carried over unchanged, one needed the hunk re-anchored for a build-config file whose surrounding comments drifted, and two hunks were dropped because the include line they rewrite does not exist in this train.", "Patch order matters and patches depend on earlier ones creating their target code. zone_id_require_aligned is introduced by offline-pgz-alignment-probe and FREEZE_ENABLED_DEFAULT by another patch in the series, so testing a patch in isolation against a clean tree gives the wrong answer. The series was regenerated by replaying it in order.", "pgz-aligned-validation and published-freezer-condition are dropped entirely. Both patch code that no patch in this train creates and that xnu-8796 does not have: zone_id_require_aligned is only referenced inside the XNU_ZONE_PGZ_ALIGNMENT_PROBE block, which is off by default and has no definition in 8796, and the FREEZE_ENABLED_DEFAULT block does not exist here.", "zzx-pmap-sync-64bit-pa patch halves split by target: osfmk/arm64/sptm/pmap/pmap.c does not exist in 8796, so that half is dropped, while its osfmk/arm/pmap/pmap.c half applies and is kept.", "The two prelink patches, security-init and sparse-index, apply to xnu-8796 without modification. XnuPrelink only ships them under xnu-10063 file names, so the copies here are renamed to xnu-8796.101.5-* to name the train they run on.", "board.toml selects only device:patches/xnu/series. The shared arch, soc and os series still target xnu-10063.141.1; referencing them would abort unixnu status with 'patch missing' or fail during application. Switch back to the four-series form once those are rebased.", "native-text-fixup.patch is among the rebased set, so payload.text_fixups is the remaining input for that path rather than a separate track.", "The boot image header version is 0, not the 4 that the NX769J board configuration records. BOARD_BOOTIMG_HEADER_VERSION is the Android build system setting for a stock boot.img; unixnu bootimg verify() unpacks ten u32 words from offset 8 and reads header_version and pagesize at the v0/v1/v2 offsets, so a v4 header fails the round-trip check. The tool defaults use 0. The sibling RedMagic port UniXNU-nx729j hit the same failure, fixed it the same way, and then fastboot-booted the image on hardware. If the NX769J ABL rejects v0 the fix is to extend verify() rather than to set the value here.", "The caihong SM8650 port omits prelink early_security_init because running AMFI early security init on a SoC without an Apple PMGR panics with 'AMFI: No PMGR?'. NX769J is the same SoC family, so treat the hook as an open risk and record the observed behaviour rather than assuming it runs.", "The image assembly now runs end to end. build userdata writes userdata-root.img 8357150720 bytes with the OS window from 096-04088-077.dmg at 0x100000 and the SystemOS window from 096-04666-078.dmg at 0x14fa00000; build payload writes payload.img 218103808 bytes carrying the OS trust cache; bootimg packs boot.img 220332032 bytes and round-trips it. The order matters: build userdata before build payload, because scripts/extract-root-volume-uuid.py reads the root volume UUID out of the userdata image. On Linux the image steps need the toolchain bin directory on PATH, since build userdata decodes LZFSE chunks with the lzfse tool that scripts/linux/setup-toolchain.py installs.", "THE PATCH SET IS NOT ALL SHARED. patches/xnu26/series now carries one entry, sheng-platform-power.patch, and that patch is vendored here as a 352-byte byte copy of UniXNU-sm8550-common patches/xnu/sheng-platform-power.patch. The copy exists because check-repository.py validates a device series by resolving each line against the series directory inside this repository, so neither the driver soc: prefix nor a ../../.. path to a sibling checkout satisfies it. It is one hunk in bsd/kern/bsd_init.c, guarded by XNU_SHENG_PMGR which is n on this board, so it compiles to nothing today and exists so that enabling that switch later does not also mean editing the patch order. The other SoC patch, native-smp-secondary.patch, is deliberately not applied: it edits board_config.h line 134, which the arm64e BCM2837 block moves, and its MAX_CPUS 8 / MAX_CPU_CLUSTERS 1 is older and less correct than that block 8 / 2. Keeping the vendored copy in step with the SoC repository is a manual step; if the SoC patch ever changes, this copy has to be refreshed."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The kernel compiles and links on xnu-8796 with this series: the build reaches 'built kernel at build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837'. Nine of the ten archive builders now pass - corecrypto twice, ArmDTPlatform, ArmCpu, SoftwareAES, the SoftwareAES bindings, the libpthread kernel component, ShengUfs and VirtioMmioBlock - and the missing per-object compile records are supplied by scripts/compile-records.py through the $(CCACHE) $(CC) hook that MakeInc.def leaves undefined. The Build workflow sets CCACHE so the same records appear on CI. XNU C rules compile without -o and let clang derive the object name, so the record states the output explicitly when the invocation leaves it implicit: build-mockfs-fixture.py and build-libpthread-kernel.py both substitute -o and otherwise write the object somewhere the consumer does not look. build-mockfs-fixture.py is also dropped from [kernel] archives, because the kernel only force-loads that archive when MOCKFS_MODE is 1 and this board leaves CONFIG_XNU_SOURCE_MOCKFS unset. The pinned libpthread is the iOS 17 drop and is one API ahead of xnu-8796 in exactly one place, proc_get_jit_entitled; patches/libpthread/ adapts it and carries UniXNU's explicit-kernel-address.patch unchanged, since a device patches/libpthread directory shadows the upstream one. The kernel now builds and links: all eleven archives pass and mach.development.bcm2837 is produced with no undefined symbols. The three gaps the link first reported were closed without a device. The eleven IOBlockStorageDevice symbols come from scripts/build-storage-bindings.py, which binds the inherited slots to the original prelinked kext code with absolute symbols taken from scripts/prelink-storage-bindings.json -- measured statically out of the iOS 16.5 kernelcache by scripts/scan-prelink-storage.py, whose output records kernelcache_sha256 e6fa7559... and so proves it read the pinned image. _boot_progress_poll is the weak observer NativeUfs calls only while verifying, and is defined as a no-op. The six verified-root symbols come from scripts/build-verified-root.py, which compiles the real VerifiedRoot crypto rather than stubbing it and generates an empty policy table: verified_root_policy_count is 0, which makes configureVerification return before it reads the key or calls vr_open, so root verification is disabled rather than approximated. A signed policy bundle is the one input still genuinely missing, and it is policy data, not code. Prelink gets through plan() and through the instruction inventory: the one literal pool that stopped it is known to scripts/emit-prelink-nx769j.py, which re-derives its boundary from the image and refuses to run if the pool no longer sits between a function epilogue and the next prologue. What remains is the early security initializer address -- see next_action. The inventory was a safety check rather than a transform, and loosening it would let real code be classified as data and drop a genuine external encoding silently. emit_prelink.py reports instruction_relocation_complete, abi_qualified and loadable as false in every plan it writes, so the artifact it produces is an experimental candidate and not a qualified kernel however these questions are settled.", "payload.text_fixups is an empty list, and that is the honest state rather than an approval. Entries disable code in a signed file after signature validation -- the worked example ends in c0035fd6, which is `ret` -- and each is a specific byte change in the dyld shared cache inside 096-04088-077.dmg, chosen to bypass whatever turns out to be in the way. None has been determined for this port. They are not derivable mechanically, and an empty list means none needed yet rather than none will be.", "The four inputs that only a device held are all collected now. The 52 vendor UEFI DXE drivers and the firmware DTB come out of the device flash package with scripts/extract-uefi-drivers.py and scripts/extract-firmware-dtb.py, and both are pinned by hash in proprietary-files.txt; the unique chip id is recorded in device-inputs.md and passed as --unique-chip-id; the root volume UUID comes out of the built userdata image with scripts/extract-root-volume-uuid.py. What assembling the images still needs is a local restore image and a local trust cache, neither of which is redistributable. The payload and the boot image now build: payload.img 218103808 bytes carrying the OS trust cache df0f60fd..., and boot.img 220344320 bytes with the FD and DTB that boot.json records. The payload and boot image are not byte-reproducible: the ADT carries a 64-byte random seed and the FD it packs is not either -- see docs/HOST-VERIFY.md.", "The Data seed is in the payload: gh run download fetches the nx769j-data-seed artifact and build payload takes it as --data-ramdisk. Each run formats a new volume, so the Data volume UUID changes with it and nothing pins one. The kernel refuses a seed whose store window does not fit the partition, so the container size has to follow the userdata geometry rather than be chosen freely.", "The rebased copies are duplicated here rather than in the owning ARM64, SoC and component repositories, which this repository does not control. They should move back once those series are rebased.", "The restore image is not redistributable, so ipsw.url carries the member name and the build takes a local copy through --ipsw or UNIXNU_IPSW."]
next_action = ["Measure the AppleMobileFileIntegrity early security initializer and set kernel.prelink.early_security_init to it. The contract is in patches/xnu/xnu-8796.101.5-security-init.patch: OSKext::start reads an _NativePrelinkEarlySecurityInit OSNumber from the kext, adds vm_kernel_slide, checks the result is 4-aligned and inside a read-execute non-writable segment of that module, and calls it as void(void) before MAC policy lockdown. So the value is an unslid function address inside the module's __TEXT_EXEC, which for this kernelcache is 0xfffffff0056fe000..0xfffffff00571b764. Identifying which function is a reversing task on a stripped kext, not a field lookup -- the __PRELINK_INFO dictionary only names the kmod stub. Until it is measured the field stays unset and emit_prelink skips the path; AMFI still starts through its ordinary start routine, but the pre-lockdown call does not happen. Separately, produce the owner-signed verified-root policy bundle over the root windows of the OS image that gets flashed and replace the generated empty table in scripts/build-verified-root.py with it, so root verification is enabled rather than disabled.", "Set the Data volume UUID the seed run reports in whichever configuration the block driver reads it from, and set the ARTIFACT_PASSPHRASE secret so the seed is uploaded encrypted rather than holding restore-image files in the clear.", "Derive a payload.text_fixup when a boot gets far enough to fail on one; there is nothing to derive before that.", "Upstream the rebased series to the ARM64, SoC and XnuPrelink repositories and restore the four-series patch_series form."]

