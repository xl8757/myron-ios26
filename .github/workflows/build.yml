name: Build

# Build tests for the myron device repository (Redmi K90 Pro Max, SM8850).
# Target: iOS 26.5.2 (23F84, Darwin 25.5.0, XNU 12377.121.6, arm64e).
#
#   validate         repository structure, TOML, pins, defconfig, and the UniXNU
#                    porting-record checker against the real component catalog
#   device-tree      compiles the two myron trees with dtc and checks the CPU
#                    topology and the ADT handoff nodes
#   resolve          installs the device-provided OS profile into the UniXNU
#                    checkout, then runs the build driver through the documented
#                    step 4 sequence: fetch resolves every source pin, defconfig
#                    merges the ordered profile fragments, tree assembles the
#                    build tree, and status reports the resolved profiles,
#                    components, source revisions and patch order
#   partition-safety runs the offline dual-system partition tests that back the
#                    non-destructive install path: they assert that GPT entries
#                    and GUIDs are preserved, that a check pass writes nothing,
#                    and that any failure blocks GPT writes
#   kernel           the real gate: resolves every archive builder and links XNU
#                    12377 with the shared arm64e series. It needs the 23F84
#                    restore image for prelink and cannot hold it, so it stops
#                    there by design; see the step.
#
# None of these jobs touch a phone, write a partition, or need Apple's image.
# The firmware volume is built from the sibling myron-uefi repository and is not
# rebuilt here; see docs/UEFI-FIRMWARE.md.
#
# Booting the image, and confirming that Android still boots afterwards,
# requires the device; see README.md for the device verification order.
#
# MIGRATION.md records what has actually been run and what has not. As of the
# iOS 26 migration nothing here has linked XNU 12377.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_prelink:
        description: "Stage the linked kernel without prelinking it. The prelinked image is 85.3 MiB and the XNU_Payload window is 56 MiB, so a boot test needs the un-prelinked one."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Check out UniXNU for the component catalog
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repository structure
        env:
          UNIXNU_COMPONENTS: ${{ github.workspace }}/tools/components.toml
        run: python3 device/scripts/check-repository.py device

      - name: Porting record
        run: python3 tools/scripts/porting-record.py check --device device

  device-tree:
    name: Compile the board device trees
    runs-on: ubuntu-latest
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Install dtc
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler

      # Both trees are self-contained: myron.dts is the byte-exact stock DTB
      # reference and myron-handoff.dts is the curated ADT handoff tree, and
      # neither includes an sm8550.dtsi. That is why this job no longer checks
      # out the SoC repository: the NX769J tree needed it, myron's does not.
      - name: Compile dts/myron.dts and dts/myron-handoff.dts
        run: |
          for name in myron myron-handoff; do
            dtc -I dts -O dtb -o "$name.dtb" "device/dts/$name.dts"
            echo "$name.dtb bytes: $(wc -c < "$name.dtb")"
            dtc -I dtb -O dts "$name.dtb" > "$name.roundtrip.dts"
          done

      # The stock DTB is Qualcomm's, not a curated tree: its CPUs carry
      # compatible = "arm,armv8", not the arm,cortex-* names the NX769J tree
      # used. An earlier draft of this step counted arm,cortex-* and got 0,
      # which failed the step. Count what the file actually contains, and use
      # `grep -c || true` wherever the answer may legitimately be zero, because
      # this job runs under `bash -e` and grep -c exits 1 on no match.
      - name: Inspect the stock reference tree
        run: |
          echo "-- root --"
          grep -E '^\s+(model|compatible) = ' myron.roundtrip.dts | head -2
          echo "-- cpu nodes --"
          grep -c 'device_type = "cpu"' myron.roundtrip.dts || true
          echo "-- cpu compatible --"
          grep -E 'compatible = "arm,armv8"' myron.roundtrip.dts | head -2
          echo "-- memory --"
          grep -A2 'device_type = "memory"' myron.roundtrip.dts | head -4
          echo "-- reserved-memory --"
          grep -c 'reserved-memory' myron.roundtrip.dts || true

      # Assert the shape the kernel needs, not the SoC vendor's spelling. Eight
      # CPU nodes and one memory node are what makes this a handoff tree rather
      # than a stub; the compatible string is not load-bearing here because XNU
      # reads the ADT, not the DTB, for CPU identity.
      - name: Check the stock tree has the CPU and memory nodes
        run: |
          cpus=$(grep -c 'device_type = "cpu"' myron.roundtrip.dts || true)
          echo "cpu nodes: $cpus"
          test "$cpus" = "8"
          test "$(grep -c 'device_type = "memory"' myron.roundtrip.dts || true)" -ge 1
          echo "stock tree carries 8 CPU nodes and a memory node"

      - name: Inspect the ADT handoff tree
        run: |
          echo "-- root --"
          grep -E '^\s+(model|compatible) = ' myron-handoff.roundtrip.dts | head -4
          echo "-- ADT-exported nodes (unixnu,adt-name) --"
          grep -c 'unixnu,adt-name' myron-handoff.roundtrip.dts || true
          echo "-- GICv3 interrupt controller --"
          grep -cE 'arm,gic-v3' myron-handoff.roundtrip.dts
          echo "-- UFS host --"
          grep -cE 'qcom,sm8850-ufshc|qcom,sm8550-ufshc' myron-handoff.roundtrip.dts

      # These are the two facts the ADT depends on. A handoff tree that loses the
      # interrupt controller or the UFS node builds fine and then produces a
      # payload with no arm-io children, which fails much later and much less
      # clearly. Assert them here instead.
      - name: Check the handoff tree carries what the ADT needs
        run: |
          test "$(grep -c 'unixnu,adt-name' myron-handoff.roundtrip.dts)" -ge 2
          test "$(grep -cE 'arm,gic-v3' myron-handoff.roundtrip.dts)" -ge 1
          test "$(grep -cE 'qcom,sm8850-ufshc|qcom,sm8550-ufshc' myron-handoff.roundtrip.dts)" -ge 1
          echo "handoff tree carries arm-io children, GICv3 and UFS"

  resolve:
    name: Resolve the build tree
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: myron-ios26

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # board.os_profile names a directory under UniXNU/profiles/os/. This port
      # targets ios-26.5.2-23F84, which does not exist upstream yet, so the
      # profile ships in this repository and is installed into the checkout
      # before resolving. It must be contributed to UniXNU once it is complete.
      #
      # Note that the arch profile is NOT copied: arm64e already ships in
      # UniXNU/profiles/arch/, and the OS profile's arch = "arm64e" selects it.
      - name: Install the OS profile
        run: |
          profile=$(python3 -c "import tomllib;print(tomllib.load(open('myron-ios26/board.toml','rb'))['board']['os_profile'])")
          echo "os profile: $profile"
          if [ -d "myron-ios26/os-profiles/$profile" ]; then
            mkdir -p "UniXNU/profiles/os"
            cp -R "myron-ios26/os-profiles/$profile" "UniXNU/profiles/os/$profile"
            echo "installed device-provided profile"
          else
            echo "using the profile already in UniXNU"
          fi
          test -f "UniXNU/profiles/os/$profile/profile.toml"

      - name: Restore the source cache
        uses: actions/cache@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ hashFiles('myron-ios26/feeds.toml', 'myron-ios26/unixnu.lock', 'UniXNU/components.toml') }}
          restore-keys: |
            feeds-

      - name: Fetch the pinned sources
        working-directory: UniXNU
        run: |
          chmod +x unixnu
          ./unixnu fetch -D ../myron-ios26

      - name: Select the device configuration
        working-directory: UniXNU
        run: ./unixnu defconfig myron_ios26_defconfig -D ../myron-ios26

      - name: Assemble the build tree
        working-directory: UniXNU
        run: ./unixnu tree -D ../myron-ios26

      - name: Report the resolved configuration
        working-directory: UniXNU
        run: |
          ./unixnu status --json -D ../myron-ios26 > status.json
          python3 - <<'PY'
          import json
          status = json.load(open('status.json'))
          print('device      :', status.get('device'), status.get('name'))
          print('output      :', status.get('output'))
          print('configured  :', status.get('configured'))
          print('schema      :', status.get('schema_version'))
          profiles = status.get('profiles') or {}
          for key, value in profiles.items():
              print(f'profile     : {key:8} {value}')
          print('patch order :', len(status.get('patch_order') or []))
          board = status.get('board') or {}
          arch = (board.get('arch') or {})
          print('arch        :', arch.get('name'), 'page_size', arch.get('page_size'))
          kernel = (board.get('kernel') or {})
          print('prelink     :')
          for key, value in (kernel.get('prelink') or {}).items():
              if key == 'roots':
                  print(f'   roots     {len(value)} entries')
              else:
                  print(f'   {key:18} {value}')
          components = status.get('components') or []
          print(f'components  : {len(components)}')
          for component in components:
              print(f"   {component['id']:22} {component['kind']:8} {component.get('build_stage')}")
          PY

      # The resolved configuration is already checked above; what this step adds
      # is that the MERGED .config has the switches this board relies on.
      #
      # Every expected value here was confirmed against the fragments that
      # actually supply it, on 2026-11-16:
      #   arch profiles/arch/arm64e/configs/common.config  BUILD_ARCHIVES,
      #     SOURCE_CORECRYPTO14, SOURCE_PTHREAD, ARM_DT_PLATFORM, ARMCPU,
      #     NATIVE_ARCH_TIMER, NATIVE_PAN
      #   soc  UniXNU-sm8550-common/configs/sm8550.config  NATIVE_ADRENO=y only
      #   os   os-profiles/ios-26.5.2-23F84/configs/ios.config  CRYPTO_BOOTSTRAP
      #   device configs/myron_ios26_defconfig  the rest
      #
      # CONFIG_XNU_NATIVE_AES is deliberately NOT expected: it appears in no
      # fragment on this target. The iOS 16 skeleton's check expected it, which
      # would have failed here for a switch nothing sets. AES comes in through
      # SoftwareAES as a component, not through a switch.
      #
      # CONFIG_XNU_NATIVE_PAC is likewise not expected: PAC is unconditional in
      # patches/xnu-12377/native-pac-keys.patch, not a config choice.
      # The device tree lives under out/myron/<profile>/<config>/, and that is
      # the only .config this check may read. A bare `find out -name .config`
      # also matches out/feeds/mu_basecore-*/.config, which is a DIRECTORY in the
      # edk2 checkout, and reading it fails with IsADirectoryError. Restrict both
      # find calls the same way.
      - name: Check the merged kernel configuration
        run: |
          config=$(find UniXNU/out/myron -name '.config' -type f | head -1)
          test -n "$config"
          echo "merged config: $config"
          python3 myron-ios26/scripts/check-merged-config.py "$config" \
            XNU_ARM_DT_PLATFORM=y \
            XNU_ARMCPU=y \
            XNU_BUILD_ARCHIVES=y \
            XNU_SOURCE_CORECRYPTO14=y \
            XNU_SOURCE_PTHREAD=y \
            XNU_NATIVE_ARCH_TIMER=y \
            XNU_NATIVE_PAN=y \
            XNU_KERNEL_CHAINED_FIXUPS=y \
            XNU_CRYPTO_BOOTSTRAP=source \
            XNU_NATIVE_UFS=y \
            XNU_NATIVE_VIRTIO_BLOCK=n \
            XNU_NATIVE_AES=n \
            XNU_NATIVE_ADRENO=n \
            XNU_NATIVE_LEGACY_DISPLAY=n \
            XNU_NATIVE_MOBILE_DISPLAY=n \
            XNU_ARMVIRT_PLATFORM=n \
            XNU_SHENG_PMGR=n

      # The prefix of every string value is load-bearing: kernel.py turns
      # CONFIG_XNU_<NAME> into the XNU_<NAME> variable the legacy build script
      # reads, and {tree} is expanded into the archive paths. Assert the whole
      # line rather than a substring.
      - name: Check the archive list on the link line
        run: |
          config=$(find UniXNU/out/myron -name '.config' -type f | head -1)
          test -n "$config"
          grep -q 'XNU_EXTRA_LD_ARCHIVES=.*libVerifiedRoot\.a' "$config"
          grep -q 'XNU_NATIVE_UFS_ARCHIVE=.*libShengUfs\.a' "$config"
          echo "verified-root and source-storage archives are on the link line"

      # status.json is written by the step above, and every step is its own
      # shell, so this one has to run in the same directory to see it.
      #
      # Detection is by PATH, not by file name. The two series share about 50
      # file names (native-arm-pan.patch and friends) but not their contents:
      # the device copies are rebased onto xnu-8796 and the shared ones onto
      # xnu-12377. Comparing names would either miss a real double-application
      # or flag a harmless collision, so compare where each entry resolves from.
      - name: Check the patch order is the arm64e one
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import json, pathlib
          status = json.load(open('status.json'))
          order = status.get('patch_order') or []
          names = [pathlib.Path(entry).name for entry in order]
          print('patch count:', len(names))
          assert names, 'the patch order is empty'
          assert names[0] == 'bcm2837-machine-config.patch', names[0]
          assert names[-1] == 'zzz-boot-progress.patch', names[-1]
          for required in ('native-pac-keys.patch', 'native-pac-arm64-user-jop.patch',
                           'native-4k-user-abi.patch', 'sheng-platform-power.patch'):
              assert required in names, f'{required} missing from the patch order'
          # The retired iOS 16 rebase lives in the device repository's
          # patches/xnu/ and must contribute nothing. The arm64e series comes
          # from UniXNU/patches/xnu-12377, the SoC two from sm8550-common.
          retired = [entry for entry in order
                     if pathlib.Path(entry).parent.name == 'xnu'
                     and 'sm8550-common' not in entry.replace('\\', '/')]
          assert not retired, f'the iOS 16 series is being applied: {retired}'
          shared = [e for e in order if 'patches/xnu-12377' in e.replace(chr(92), '/')]
          # 69 arch + 1 os from the shared trees, 1 vendored SoC patch from the
          # device series. The vendored copy lives in patches/xnu26/, so it is
          # not counted as a UniXNU-sm8550-common entry.
          print(f'shared patches: {len(shared)}, total: {len(order)}')
          assert len(shared) >= 68, f'only {len(shared)} shared patches resolved'
          # 73, not 72: myron-early-console.patch joined the device series on 2026-11-18
          assert len(order) == 73, f'expected 73 patch paths, got {len(order)}'
          assert 'sheng-platform-power.patch' in names, 'the vendored SoC patch is missing'
          # native-smp-secondary.patch is deliberately not applied: it edits
          # board_config.h line 134, which the arm64e BCM2837 block moves, and its
          # MAX_CPUS 8 / MAX_CPU_CLUSTERS 1 is older and less correct than the
          # block's 8 / 2.
          assert 'native-smp-secondary.patch' not in names, \
              'the superseded SoC SMP patch is back in the order'
          print('patch order is arch + os + one SoC patch; the iOS 16 rebase is not applied')
          PY

      - name: Check the recorded source pins
        run: |
          echo "unixnu.lock after fetch:"
          git -C myron-ios26 --no-pager diff -- unixnu.lock
          git -C myron-ios26 diff --quiet -- unixnu.lock || {
            echo '::error::unixnu.lock does not match what ./unixnu fetch resolved. Run ./unixnu fetch and commit the result.'
            exit 1
          }
          echo "unixnu.lock matches the resolved sources"

  partition-safety:
    name: Non-destructive install path
    runs-on: ubuntu-latest
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The dual-system partition tool carves a `unixnu` partition from the end
      # of userdata and must leave everything else alone. These are its offline
      # tests: no phone required, documented for Linux, WSL and macOS.
      - name: Run the dual-system partition tests
        working-directory: tools
        run: python3 scripts/dual_sys/test_dual_sys.py -v

      - name: Check the recovery script parses
        run: sh -n tools/scripts/dual_sys/twrp.sh

      - name: Build the F2FS shrink helper and run its self-test
        run: |
          cc -O2 -Wall -Wextra -Werror \
            tools/scripts/dual_sys/f2fs-shrink.c -o /tmp/f2fs-shrink-test
          file /tmp/f2fs-shrink-test
          /tmp/f2fs-shrink-test self-test

      # The plan bundle carries both GPT copies before and after, so a run that
      # stops part way can be inspected. Assert the builder emits them.
      - name: Check the plan bundle layout
        run: |
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path('tools/scripts/dual_sys')
          for name in ('partition.py', 'gpt.py', 'f2fs-shrink.c', 'twrp.sh', 'test_dual_sys.py'):
              assert (root / name).is_file(), f'{name} missing'
          text = (root / 'partition.py').read_text(encoding='utf-8')
          for entry in ('gpt-primary.before', 'gpt-backup.before',
                        'gpt-primary.after', 'gpt-backup.after', 'SHA256SUMS'):
              assert entry in text, f'plan bundle does not emit {entry}'
          print('plan bundle emits both GPT copies before and after, plus SHA256SUMS')
          PY

  # The real gate for this port: XNU 12377 plus the shared arm64e series must
  # build.
  # On Linux the kernel step uses upstream clang and an open source Mach-O
  # toolchain instead of Xcode; scripts/linux/setup-toolchain.py installs it.
  # The toolchain is expensive to build and is cached between runs.
  kernel:
    name: Build the kernel
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: myron-ios26

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The host dependencies come from apt, not from the toolchain cache, so
      # they have to be installed even when the cached toolchain is restored.
      # Without this the cache hit skips setup-toolchain.py and --check then
      # fails on missing libclang, libbsd and the build tools.
      - name: Install the host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build cmake flex bison \
            python3 python3-dev xz-utils bzip2 cpio rsync curl wget \
            libssl-dev zlib1g-dev libbsd-dev uuid-dev llvm-dev libclang-dev \
            tcsh unifdef mtools device-tree-compiler

      # XNU 12377 writes OS_PTRAUTH_SIGNED_PTR_AUTH_NULL with a fourth __ptrauth
      # argument, "authenticates-null-values". Upstream clang's parser rejects
      # more than three arguments and Sema hardcodes the null-authentication bit
      # to false, so compiling libdispatch against XNU's headers fails with
      #   sys/ucred.h:164:20: error: '__ptrauth' qualifier must take between 1
      #   and 3 arguments
      # Apple's clang accepts it. setup-toolchain.py already applies one LLVM
      # patch (llvm-xnu-builtin-type.patch); this drops a second patch beside it
      # before the installer runs, so the clang it builds understands the syntax.
      # The patch is three files and 20 lines: the parser's count check, the
      # diagnostic text, and Sema's handler, which now validates the literal and
      # passes the flag to PointerAuthQualifier::Create - a path that already
      # exists upstream through CodeGen and DebugInfo.
      - name: Teach the toolchain clang about XNU's fourth ptrauth argument
        run: |
          cp myron-ios26/scripts/linux/llvm-ptrauth-null-values.patch \
             UniXNU/scripts/linux/llvm-ptrauth-null-values.patch
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/linux/setup-toolchain.py')
          t = p.read_text(encoding='utf-8')
          anchor = "run(['git', '-C', src, 'apply', HERE / 'llvm-xnu-builtin-type.patch'])"
          assert anchor in t, 'setup-toolchain.py no longer applies the builtin-type patch'
          extra = (anchor + "\n" +
                   "        run(['git', '-C', src, 'apply', HERE / 'llvm-ptrauth-null-values.patch'])")
          if 'llvm-ptrauth-null-values.patch' not in t:
              p.write_text(t.replace(anchor, extra), encoding='utf-8')
              print('setup-toolchain.py now applies the ptrauth patch')
          else:
              print('ptrauth patch already wired')
          PY
          grep -n 'llvm-ptrauth-null-values' UniXNU/scripts/linux/setup-toolchain.py

      # Restore and save are separate steps. The kernel job is expected to fail
      # while this port is being brought up, and actions/cache's combined form
      # only saves on success, so without an explicit save the entry is never
      # written and every run rebuilds clang from source.
      - name: Restore the toolchain cache
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/unixnu-linux
          key: unixnu-linux-toolchain-${{ hashFiles('UniXNU/scripts/linux/**') }}

      # Install under the runner's home, not /opt. The path is expanded before
      # sudo, which resets HOME to /root. scripts/unixnu/kernel.py resolves the
      # toolchain through UNIXNU_TOOLCHAIN, so the same variable drives both the
      # install and the build.
      # Run unconditionally. The installer is idempotent: each component is
      # skipped when it already exists, so on a cache hit it only places the
      # shims the cache cannot hold. /usr/bin/xcrun is one of them and
      # scripts/unixnu/kernel.py requires it, so skipping this step on a cache
      # hit leaves the build failing with "xcrun missing".
      - name: Install the Linux toolchain
        working-directory: UniXNU
        run: |
          TOOLCHAIN="$HOME/unixnu-linux"
          sudo env UNIXNU_TOOLCHAIN="$TOOLCHAIN" python3 scripts/linux/setup-toolchain.py "$TOOLCHAIN"
          sudo chown -R "$(id -u):$(id -g)" "$TOOLCHAIN"

      # XNU 12377 writes OS_PTRAUTH_SIGNED_PTR_AUTH_NULL with a fourth __ptrauth
      # argument, "authenticates-null-values". Upstream clang's parser rejects
      # more than three arguments and Sema hardcodes the null-authentication bit
      # to false, so building libdispatch against XNU's headers fails with
      #   sys/ucred.h:164:20: error: '__ptrauth' qualifier must take between 1
      #   and 3 arguments
      # Apple's clang accepts it. scripts/linux/setup-toolchain.py already
      # applies one LLVM patch (llvm-xnu-builtin-type.patch) the same way; this
      # drops a second patch next to it before the installer runs, so the
      # toolchain it builds understands the syntax. The patch touches three
      # files and 20 lines: the parser's argument-count check, the diagnostic
      # text, and Sema's handler, which now validates the string literal and
      # passes the flag through to PointerAuthQualifier::Create - a path that
      - name: Save the toolchain cache
        if: always() && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/unixnu-linux
          key: unixnu-linux-toolchain-${{ hashFiles('UniXNU/scripts/linux/**') }}

      - name: Check the toolchain
        working-directory: UniXNU
        run: UNIXNU_TOOLCHAIN="$HOME/unixnu-linux" python3 scripts/linux/setup-toolchain.py --check --llvm-config /usr/bin/llvm-config

      - name: Install the OS profile
        run: |
          profile=$(python3 -c "import tomllib;print(tomllib.load(open('myron-ios26/board.toml','rb'))['board']['os_profile'])")
          test -d "myron-ios26/os-profiles/$profile"
          mkdir -p "UniXNU/profiles/os"
          cp -R "myron-ios26/os-profiles/$profile" "UniXNU/profiles/os/$profile"
          echo "installed os profile: $profile"

      - name: Restore the source cache
        uses: actions/cache@v4
        with:
          path: UniXNU/out
          key: xnu12377-sources-${{ hashFiles('myron-ios26/feeds.toml', 'myron-ios26/unixnu.lock', 'UniXNU/components.toml') }}
          restore-keys: |
            xnu12377-sources-

      # The archive builders replay per-object compile recipes out of the XNU
      # build. build-arm-driver.py filters every -W flag out of the replayed
      # command and then appends its own strict set, ending in -Werror, so the
      # driver sources are compiled strictly regardless of the kernel's own
      # BUILD_WERROR=0.
      #
      # The replayed recipe carries -mios-version-min=26.0 while the script also
      # passes --target=arm64e-apple-ios17.0.0. The clang this job builds treats
      # that override as a warning, and -Werror turns it into a hard error:
      #   clang-24: error: overriding '-mios-version-min=26.0' option with
      #   '--target=arm64e-apple-ios17.0.0' [-Werror,-Woverriding-option]
      # The kernel build itself hits the same diagnostic 1156 times and keeps
      # going, because BUILD_WERROR is 0 there. Only this one warning is
      # downgraded; every other -Werror check on the driver sources stands.
      - name: Let the archive replay tolerate the target-version override
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/build-arm-driver.py')
          t = p.read_text(encoding='utf-8')
          old = "command.extend(['-Wall', '-Wextra', '-Werror', '-Wno-unused-parameter',"
          new = ("command.extend(['-Wall', '-Wextra', '-Werror', "
                 "'-Wno-error=overriding-option', '-Wno-unused-parameter',")
          if '-Wno-error=overriding-option' in t:
              print('already patched')
          else:
              assert old in t, 'build-arm-driver.py warning list changed'
              p.write_text(t.replace(old, new), encoding='utf-8')
              print('downgraded overriding-option for the archive replay')
          PY
          grep -n 'Wno-error=overriding-option' UniXNU/scripts/build-arm-driver.py

      # linux_env() in scripts/unixnu/kernel.py hardcodes the Linux cross target
      # to arm64 / iOS 17.0:
      #     'UNIXNU_SDK_VERSION': '17.0',
      #     'DARWIN_TRIPLE': 'arm64-apple-ios17.0',
      # That value reaches scripts/linux/clang, which prepends `-target
      # $DARWIN_TRIPLE` to every invocation - including the archive builders,
      # which replay per-object recipes out of the kernel build. The kernel
      # itself overrides the version with -miphoneos-version-min, but those
      # replays do not, so their objects are stamped for iOS 17.0 while the
      # kernel audit (scripts/kernel_target.py, driven by the profile's
      # ios_version) expects iOS 26.0 and refuses them:
      #   ArmDTPlatform: deployment (2, 1114112), expected (2, 1703936)
      # 1114112 is 17.0, 1703936 is 26.0.
      #
      # The two values are derived from the selected profile rather than
      # hardcoded, so this board builds for the platform it targets. The arch
      # part matters too: arm64 (not arm64e) in the triple makes clang drop the
      # pointer-authentication ABI the arm64e series relies on.
      - name: Point the cross target at the selected profile
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          board = tomllib.load(open('myron-ios26/board.toml', 'rb'))
          profile_name = board['board']['os_profile']
          profile = tomllib.load(open(f'UniXNU/profiles/os/{profile_name}/profile.toml', 'rb'))
          arch = profile['os'].get('arch', 'arm64')
          ios_version = profile['os']['ios_version']

          path = pathlib.Path('UniXNU/scripts/unixnu/kernel.py')
          text = path.read_text(encoding='utf-8')
          old_sdk = "            'UNIXNU_SDKROOT': str(fakeroot), 'UNIXNU_SDK_VERSION': '17.0',"
          old_triple = "'CROSS_CLANG': str(toolchain / 'llvm/bin/clang'), 'DARWIN_TRIPLE': 'arm64-apple-ios17.0',"
          assert old_sdk in text, 'linux_env SDK line changed upstream'
          assert old_triple in text, 'linux_env triple line changed upstream'
          new_sdk = ("            'UNIXNU_SDKROOT': str(fakeroot), "
                     f"'UNIXNU_SDK_VERSION': '{ios_version}',")
          new_triple = ("'CROSS_CLANG': str(toolchain / 'llvm/bin/clang'), "
                        f"'DARWIN_TRIPLE': '{arch}-apple-ios{ios_version}',")
          text = text.replace(old_sdk, new_sdk).replace(old_triple, new_triple)
          path.write_text(text, encoding='utf-8')
          print(f'cross target -> {arch}-apple-ios{ios_version}')
          PY
          grep -n "DARWIN_TRIPLE'\|UNIXNU_SDK_VERSION'" UniXNU/scripts/unixnu/kernel.py

      # scripts/build-sheng-source-storage.py calls
      #   headers.prepare(storage, '7edb88fbae296fb7c8ce2f64e115e116e566d51c', ...)
      # with a hardcoded commit, while scripts/prepare-storage-headers.py defines
      #   LEGACY_REVISION = 'e45fbe30a7879e0b16e26dddb78538f1b00e0bff'
      # and feeds.toml pins IOStorageFamily to that same e45fbe30. The literal in
      # the caller is a stale UniXNU-sheng pin, and because it is passed as an
      # argument it also defeats the script's own
      # UNIXNU_IOSTORAGEFAMILY_COMMIT override. The result is
      #   feeds/IOStorageFamily-67f9003c: expected full commit 7edb88fb..., found e45fbe30...
      # which is the check complaining about a value the repository never chose.
      #
      # Pass the module's own constant instead, so the caller cannot disagree with
      # the module it is calling. If upstream ever repins IOStorageFamily, both
      # move together.
      - name: Let the storage adapter use the pinned headers revision
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path('UniXNU/scripts/build-sheng-source-storage.py')
          text = path.read_text(encoding='utf-8')
          stale = "headers.prepare(storage, '7edb88fbae296fb7c8ce2f64e115e116e566d51c', out / 'headers')"
          fixed = "headers.prepare(storage, headers.LEGACY_REVISION, out / 'headers')"
          if fixed in text:
              print('already patched')
          else:
              assert stale in text, 'the storage adapter call changed upstream'
              path.write_text(text.replace(stale, fixed), encoding='utf-8')
              print('storage adapter now uses LEGACY_REVISION')
          PY
          grep -n "headers.prepare(storage" UniXNU/scripts/build-sheng-source-storage.py

      # scripts/unixnu/kernel.py hands every archive recipe a UNIXNU_DEVICE
      # environment variable holding the device repository (line: env = dict(env,
      # ..., UNIXNU_DEVICE=str(ctx.device))). scripts/build-sheng-source-storage.py
      # is the one recipe that needs to read device files, and it ignores that
      # variable:
      #     tree = args.tree.resolve()
      #     device = (args.device or tree).resolve()
      # With no --device on the command line it resolves the device to the build
      # tree, so device_source() looks for the driver sources in
      # <tree>/package and <tree>/kits/sheng, never in the repository that
      # actually holds them. Every lookup then fails with
      #   BootLog.c not found under the device or build tree
      # even though the file is present and checked out.
      #
      # Read the variable the caller already sets. This is the same channel every
      # other consumer uses, and it keeps the recipe command line free of an
      # absolute path that would have to be computed per run.
      - name: Let the storage adapter see the device repository
        run: |
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path('UniXNU/scripts/build-sheng-source-storage.py')
          text = path.read_text(encoding='utf-8')
          old_device = "    device = (args.device or tree).resolve()"
          new_device = ("    device = (args.device or Path(os.environ.get('UNIXNU_DEVICE', tree))).resolve()")
          old_ufs = "    sources = [base, device / 'drivers/ShengUfs/NativeUfs.cpp',"
          new_ufs = "    sources = [base, tree / 'drivers/ShengUfs/NativeUfs.cpp',"
          if "UNIXNU_DEVICE" in text and "'drivers/ShengUfs/NativeUfs.cpp'" in text and 'tree /' in text.split("NativeUfs.cpp")[0][-40:]:
              print('already patched')
          else:
              assert old_device in text, 'the device resolution line changed upstream'
              assert old_ufs in text, 'the UFS source line changed upstream'
              text = text.replace(old_device, new_device, 1).replace(old_ufs, new_ufs, 1)
              path.write_text(text, encoding='utf-8')
              print('adapter reads UNIXNU_DEVICE and takes NativeUfs.cpp from the tree')
          PY
          grep -nE "device = \\(args.device|drivers/ShengUfs/NativeUfs" UniXNU/scripts/build-sheng-source-storage.py

      # The source-built corecrypto archive is attached without -force_load:
      #     KERNEL_EXTRA_ARCHIVES="-L$KERNEL_SDKROOT/usr/local/lib/kernel
      #                            -lfirehose_kernel $CRYPTO_ARCHIVE"
      # Every other archive in that script uses -Wl,-force_load. Because this one
      # is searched lazily, only the objects some reference pulls in are linked.
      # cc_fips/src/fipspost_post.c is in the corecrypto_kext target's 631 sources
      # and instantiates
      #     __attribute__((section("__TEXT,__fips_hmacs"))) const unsigned char ...[32]
      # but nothing references it, so its object is dropped and the section never
      # reaches the kernel. scripts/seal-source-crypto-kernel.py then refuses:
      #     Missing real provider code or POST HMAC field
      # Force-loading the archive keeps that object, which is what the seal step
      # hashes. Nothing else changes: the archive is the namespaced build, so its
      # provider symbols cannot collide with the kernel's own.
      - name: Keep the corecrypto FIPS objects in the kernel link
        run: |
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          text = path.read_text(encoding='utf-8')
          old = ('  KERNEL_EXTRA_ARCHIVES="-L$KERNEL_SDKROOT/usr/local/lib/kernel '
                 '-lfirehose_kernel $CRYPTO_ARCHIVE"')
          new = ('  # -force_load keeps fipspost_post.o: its __TEXT,__fips_hmacs section is\n'
                 '  # what seal-source-crypto-kernel.py hashes, and nothing references it.\n'
                 '  KERNEL_EXTRA_ARCHIVES="-L$KERNEL_SDKROOT/usr/local/lib/kernel '
                 '-lfirehose_kernel -Wl,-force_load,$CRYPTO_ARCHIVE"')
          if '-Wl,-force_load,$CRYPTO_ARCHIVE' in text:
              print('already force-loads the crypto archive')
          else:
              assert old in text, 'the crypto archive line changed upstream'
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('crypto archive is force-loaded')
          PY
          grep -n 'force_load,\$CRYPTO_ARCHIVE' UniXNU/scripts/build-xnu-4k-baseline.sh

      - name: Fetch, configure and assemble
        working-directory: UniXNU
        run: |
          chmod +x unixnu
          ./unixnu fetch -D ../myron-ios26
          ./unixnu defconfig myron_ios26_defconfig -D ../myron-ios26
          ./unixnu tree -D ../myron-ios26

      # On the iOS 16 target this asserted that the resolved order equals
      # patches/xnu/series exactly, because that file was the whole order. It is
      # not any more: the order is the shared arch + soc + os series, and
      # patches/xnu/series is the retired iOS 16 rebase.
      #
      # Detection is by PATH, not by file name. The two series share about 50
      # file names (native-arm-pan.patch and friends) but not their contents:
      # the device copies are rebased onto xnu-8796 and the shared ones onto
      # xnu-12377. Comparing names would either miss a real double-application or
      # flag a harmless collision, so compare where each entry came from.
      # kits/XnuPrelink/native_prelink.py inspects an arm64 Mach-O and refuses
      # anything else on one line:
      #     if (magic, cpu, subtype) != (0xfeedfacf, 0x100000c, 0):
      #         raise ValueError('Only ordinary little-endian ARM64 is supported')
      # The subtype field is not just an architecture id. Bits 0-7 name the
      # architecture (0 arm64, 2 arm64e) and bits 24-31 carry the ABI version,
      # which clang sets for an arm64e target. An arm64e object therefore has
      # subtype 0x80000002, and comparing the whole word to zero rejects every
      # arm64e object - including the vtable reference object that
      # build-storage-bindings.py compiles on this board, whose kernel is arm64e.
      # The check now compares the architecture byte and accepts both arm64 and
      # arm64e. Everything else about the parser is unchanged, and the caller
      # only reads load commands, segments and symbol names, none of which depend
      # on the pointer-authentication ABI.
      - name: Let the prelink Mach-O parser read arm64e objects
        run: |
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path('UniXNU/kits/XnuPrelink/native_prelink.py')
          text = path.read_text(encoding='utf-8')
          old = ("    if (magic, cpu, subtype) != (0xfeedfacf, 0x100000c, 0):\n"
                 "        raise ValueError('Only ordinary little-endian ARM64 is supported')")
          new = ("    # Bits 0-7 are the architecture, bits 24-31 the ABI version.\n"
                 "    if (magic, cpu) != (0xfeedfacf, 0x100000c) or (subtype & 0xff) not in (0, 2):\n"
                 "        raise ValueError('Only ordinary little-endian ARM64 is supported')")
          if 'subtype & 0xff' in text:
              print('already accepts arm64e')
          else:
              assert old in text, 'the macho() architecture check changed upstream'
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('macho() now accepts arm64 and arm64e')
          PY
          grep -n "subtype & 0xff" UniXNU/kits/XnuPrelink/native_prelink.py

      - name: Verify the patch order
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          out = subprocess.run(['UniXNU/unixnu', 'status', '--json', '-D', 'myron-ios26'],
                               capture_output=True, text=True, check=True).stdout
          status = json.loads(out)
          order = status.get('patch_order') or []
          names = [pathlib.Path(entry).name for entry in order]
          print(f'resolved patch order: {len(order)} entries')
          for entry in order:
              print('  ', entry)
          assert names, 'the patch order is empty'
          assert names[0] == 'bcm2837-machine-config.patch', names[0]
          assert names[-1] == 'zzz-boot-progress.patch', names[-1]
          for required in ('native-pac-keys.patch', 'native-pac-arm64-user-jop.patch',
                           'native-4k-user-abi.patch', 'sheng-platform-power.patch'):
              assert required in names, f'{required} missing from the patch order'
          # The retired iOS 16 rebase lives in patches/xnu/ and must contribute
          # nothing. Its own directory is the signature: the arm64e series comes
          # from UniXNU/patches/xnu-12377, the SoC two from sm8550-common.
          retired = [entry for entry in order
                     if pathlib.Path(entry).parent.name == 'xnu'
                     and 'sm8550-common' not in entry]
          assert not retired, f'the iOS 16 series is being applied: {retired}'
          shared = [entry for entry in order if 'patches/xnu-12377' in entry]
          print(f'shared patches: {len(shared)}, total: {len(order)}')
          assert len(shared) >= 68, f'only {len(shared)} shared patches resolved'
          # 73, not 72: myron-early-console.patch joined the device series on 2026-11-18
          assert len(order) == 73, f'expected 73 patch paths, got {len(order)}'
          assert 'sheng-platform-power.patch' in names, 'the vendored SoC patch is missing'
          # native-smp-secondary.patch is deliberately not applied: it edits
          # board_config.h line 134, which the arm64e BCM2837 block moves, and its
          # MAX_CPUS 8 / MAX_CPU_CLUSTERS 1 is older and less correct than the
          # block's 8 / 2.
          assert 'native-smp-secondary.patch' not in names, \
              'the superseded SoC SMP patch is back in the order'
          print('patch order is arch + os + one SoC patch; the iOS 16 rebase is not applied')
          PY

      # Parallel make interleaves its output so heavily that the diagnostic for
      # the failing compile is garbled past reading. On failure, repeat serially
      # so the log names the actual error, then decide.
      #
      # CCACHE points XNU's `$(CCACHE) $(CC)` hook at the compile recorder. The
      # archive builders replay a per-object recipe, {directory, file, arguments},
      # and nothing on Linux writes those records without it, so the archive stage
      # stops at the first builder that reads one. The recorder is a transparent
      # wrapper: it writes the record and then execs the real compiler.
      #
      # CI cannot run the prelink half of this step: it needs the 23F84 restore
      # image, which is not redistributable and about 11 GB. What CI does prove
      # is that XNU 12377 with the shared arm64e series compiles and links on
      # Linux with the open source Mach-O toolchain. The step asserts exactly
      # that, and treats a stop at the missing restore image as the expected
      # boundary.
      # The "did not link" branch has to look at the log before it fails. XNU
      # 12377 reaches the link and then stops because prelink has no 23F84
      # restore image, and on that path there is no mach.development.bcm2837*
      # file to find: the kernel archives and the link happen, then kernel.py
      # asks ipsw.py for the kernelcache and raises. Treating a missing kernel
      # as a hard failure would report the expected stop as a broken build.
      # Only a stop that is NOT one of the known missing-input messages is a
      # real failure here.
      #
      # `if ... | tee build.log; then` tests THE EXIT STATUS OF tee, not of
      # unixnu. On 2026-11-16 that turned a hard patch failure into a green job:
      # native-smp-secondary.patch failed to apply, unixnu exited nonzero, tee
      # exited 0, and the branch printed "kernel build passed". The status is
      # now taken from PIPESTATUS on both invocations, and a patch failure is
      # called out by name before anything else is decided.
      # Prelink runs with --allow-missing (board.toml [kernel.prelink]), so a
      # candidate is written even though only 6805 of 21113 original functions
      # pair. That makes the image experimental: emit_prelink records every
      # unresolved reference in kernel.macho.json, and a boot would fail at the
      # first rebound kext. It is still the honest next artifact - it is the real
      # prelinked fileset rather than the native-only stage - and the report says
      # exactly how much is unbound.
      - name: Build the kernel
        working-directory: UniXNU
        env:
          CCACHE: python3 ${{ github.workspace }}/myron-ios26/scripts/compile-records.py
        run: |
          set -o pipefail
          SKIP_PRELINK=""
          if [ "${{ inputs.skip_prelink }}" = "true" ]; then SKIP_PRELINK=--skip-prelink; fi
          UNIXNU_TOOLCHAIN="$HOME/unixnu-linux" ./unixnu build kernel $SKIP_PRELINK -D ../myron-ios26 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "kernel build passed"
            exit 0
          fi
          echo "::warning::parallel build failed (status $status); repeating serially for a readable diagnostic"
          rm -rf out/myron/*/myron_ios26/logs
          UNIXNU_TOOLCHAIN="$HOME/unixnu-linux" ./unixnu build kernel $SKIP_PRELINK -j 1 -D ../myron-ios26 2>&1 | tee build.log
          status=${PIPESTATUS[0]}

          # A patch that does not apply is never the expected boundary.
          if grep -qE 'patch does not apply|git failed \(1\)|patch failed:' build.log; then
            echo '::error::a patch in the resolved order does not apply; see the patch lines above'
            exit 1
          fi

          missing_input='IPSW not found|kernelcache not found|does not match the kernelcache|UNIXNU_IPSW|restore image'

          kernel=$(find out -name 'mach.development.bcm2837*' -type f | head -1)
          staged=$(find out -name 'kernel.macho' -type f | head -1)
          if [ -n "$staged" ]; then
            # --skip-prelink stages the linked binary as kernel.macho and records
            # mode=native-only beside it. This is the bring-up artifact; prelinked
            # kexts are still required before an iOS user space can boot.
            echo "staged native kernel: $staged ($(wc -c < "$staged") bytes)"
            cat "$staged.json" 2>/dev/null || true
          fi
          if [ -n "$kernel" ]; then
            echo "linked kernel: $kernel ($(wc -c < "$kernel") bytes)"
          elif grep -qE "$missing_input" build.log; then
            echo '::warning::the kernel did not link because prelink needs the 23F84 restore image, which CI cannot hold and which is not redistributable'
            exit 0
          else
            echo '::error::the kernel did not link and the log does not mention a missing restore image'
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            echo "kernel build passed"
          elif grep -qE "$missing_input" build.log; then
            echo '::warning::the kernel built and linked; prelink needs the 23F84 restore image, which CI cannot hold'
          else
            echo '::error::the kernel step failed after the link'
            exit 1
          fi

      # Build the RELEASE-LTO comparison kernel.
      #
      # The prelink step pairs the native kernel's functions against Apple's
      # RELEASE-LTO 23F84 kernelcache. Our normal build is DEVELOPMENT + LTO off
      # (build-xnu-4k-baseline.sh hard codes both), which produces 29411
      # functions with 841 diversities against Apple's 21113 with 2885. Only
      # 32% of the functions find a reliable anchor, and board.toml records what
      # that means: an image that stops at the first rebound kext.
      #
      # scripts/build-fileset-release-reference.py from UniXNU builds the same
      # tree as RELEASE with LTO on, in its own output directory, so the two
      # configurations cannot contaminate each other. It is the comparison
      # kernel the prelink step was meant to read: it never runs, so the script
      # stubs the native hooks and drops the forced exports the link cannot
      # satisfy, then links again.
      #
      # This is a size and pairing measurement first. Whether the prelink step
      # then produces a bootable image is the next question, and it needs the
      # 23F84 kernelcache.
      - name: Build the RELEASE-LTO reference kernel
        working-directory: UniXNU
        continue-on-error: true
        run: |
          set -o pipefail
          tree=out/myron/ios-26.5.2-23F84/myron_ios26/tree
          test -d "$tree" || { echo "::error::no prepared tree at $tree"; exit 1; }

          # build-fileset-release-reference.py has no Linux branch: it copies the tree
          # and runs make with a hard coded argument list, so make still asks a Mac for
          # the host CPU count and memory (sysctl hw.physicalcpu, sw_vers, hw.memsize),
          # gets nothing, and stops in MakeInc before compiling. MakeInc assigns those
          # names with :=, which overrides the environment, so the values have to arrive
          # as make arguments. The helper below inserts exactly what
          # scripts/build-xnu-4k-baseline.sh passes on Linux, and fails loudly if
          # upstream moves the anchor.
          python3 ../myron-ios26/scripts/patch-release-reference-linux.py --mu-root .
          # The reference script is not run through `unixnu`, so it does not inherit the
          # environment scripts/unixnu/kernel.py builds for the normal kernel step.
          # Those variables are what make the clang wrapper work at all: it execs
          # ${CROSS_CLANG:-/opt/unixnu-linux/llvm/bin/clang} and the default does not
          # exist here, which is exactly the 'clang: line 32: /opt/unixnu-linux/llvm/
          # bin/clang: No such file or directory / exit 127' this step hit. The values
          # below are kernel.py lines 102-109, read from that file.
          TOOLCHAIN="$HOME/unixnu-linux"
          CLT="$TOOLCHAIN/CommandLineTools/usr"
          XCTOOLCHAIN="$TOOLCHAIN/XcodeDefault.xctoolchain/usr"
          # prepare-xnu.py hard codes ROOT = <UniXNU>/.cache, not the build tree, so the
          # fakeroot the driver resolves and the one prepare-xnu.py writes are different
          # directories. Use prepare-xnu.py's own location for anything it produces, and
          # keep the tree's fakeroot for the SDK path the reference build reads.
          PREP_FAKEROOT="$(pwd)/.cache/fakeroot"
          FAKEROOT="$tree/.cache/fakeroot"

          export LC_ALL=C
          export CLT_PREFIX="$CLT"
          export XCTOOLCHAIN_PREFIX="$XCTOOLCHAIN"
          export XNU_TOOLCHAIN_BIN="$CLT/bin $XCTOOLCHAIN/bin"
          export UNIXNU_SDKROOT="$FAKEROOT"
          export UNIXNU_SDK_VERSION=17.0
          export UNIXNU_PLATFORM_PATH="$FAKEROOT/Platforms/iPhoneOS.platform"
          export CROSS_CLANG="$TOOLCHAIN/llvm/bin/clang"
          export DARWIN_TRIPLE=arm64-apple-ios17.0
          export CROSS_EXTRA_FLAGS='-mllvm -disable-atexit-based-global-dtor-lowering'
          export CCC_OVERRIDE_OPTIONS='# +-Wno-missing-designated-field-initializers +-Wno-unused-but-set-global'
          export PLATFORM=iPhoneOS
          export HOST_CC="$CLT/bin/xnu-host-cc"
          export MIGCOM="$CLT/libexec/migcom"
          export M4="$CLT/bin/gm4"
          # flex execs gm4 by name, so the CLT bin has to be on PATH, not just the
          # toolchain root.
          export PATH="$CLT/bin:$TOOLCHAIN/bin:$PATH"

          for f in "$CROSS_CLANG" "$HOST_CC" "$MIGCOM" "$M4"; do
            test -x "$f" || { echo "::error::missing toolchain file: $f"; exit 1; }
          done

          # The RELEASE link stops on two symbols OSKext.cpp declares and expects
          # compiler-rt to provide:
          #   __llvm_profile_get_size_for_buffer_internal
          #   __llvm_profile_write_buffer_internal
          # libcc_kext.a is where a Mac gets them, but on this runner
          # prepare-xnu.py libs cannot build it: it needs the SDK headers that
          # installhdrs writes into the fakeroot, and this reference build does its own
          # copytree without running installhdrs (it fails with
          # 'sys/_types.h file not found'). For a comparison kernel that never runs,
          # stubbing them is the right answer, and the reference script already stubs
          # undefined native hooks for the same reason. The helper below widens its stub
          # pattern to cover __llvm_profile_*, so no libcc_kext.a is needed here.

          # No --lto: setup-toolchain.py builds cctools-port with
          # --disable-lto-support ("the kernel link uses no LTO"), so our ld64 has no
          # LLVM LTO backend. With BUILD_LTO=1 clang emits bitcode and ld ignores all
          # 956 objects as "unknown-unsupported file format", then fails. Without it the
          # build is KERNEL_CONFIGS=RELEASE with ordinary Mach-O objects, which is the
          # part that matters here: RELEASE is what brings the function set in line with
          # Apple's kernelcache. The output name is the same either way.
          UNIXNU_TOOLCHAIN="$HOME/unixnu-linux" \
            python3 scripts/build-fileset-release-reference.py --tree "$tree" 2>&1 | tee release.log
          status=${PIPESTATUS[0]}

          built=$(find "$tree/build/xnu/fileset-reference" -name 'mach.release.bcm2837.unstripped.noctf' -type f 2>/dev/null | head -1)
          if [ -n "$built" ]; then
            echo "RELEASE-LTO kernel: $built ($(wc -c < "$built") bytes)"
            sha256sum "$built"
          fi

          # The prelink emitter reads LC_SEGMENT_SPLIT_INFO and the RELEASE kernel has
          # no such command, so emit_images stops. XNU puts -Wl,-add_split_seg_info in
          # LDFLAGS_KERNEL_ONLY_SUBARCH_arm64e and that same variable creates
          # __LINKINFO, which the RELEASE kernel does have - so the flag reaches the
          # link but does not take effect. Comparing the DEVELOPMENT image against the
          # RELEASE one is what will say why, so dump both.
          dev=$(find out -name 'mach.development.bcm2837.unstripped.noctf' -type f 2>/dev/null | head -1)
          echo "--- load command comparison ---"
          python3 ../myron-ios26/scripts/dump-load-commands.py \
            ${dev:+"$dev"} ${built:+"$built"} || true

          # Compare what the two configurations produce. The number that matters is the
          # defined text symbols: prelink pairs function bodies, so this is the
          # denominator against Apple's 21113.
          #
          # No -arch here: that is cctools' flag and the nm on PATH is GNU nm, which
          # rejects it and printed 0 for both kernels on the first run. GNU nm reads the
          # Mach-O fine with --defined-only, and the leading '_' it prints is the Mach-O
          # convention, which is also how the prelink emitter names things.
          dev=$(find out -name 'mach.development.bcm2837.unstripped.noctf' -type f 2>/dev/null | head -1)
          for f in "$dev" "$built"; do
            [ -n "$f" ] || continue
            n=$(nm --defined-only "$f" 2>/dev/null | grep -Ec ' [Tt] ' || true)
            total=$(nm --defined-only "$f" 2>/dev/null | wc -l || true)
            echo "$(basename "$f"): $n defined text symbols, $total symbols total ($(wc -c < "$f") bytes)"
          done

          if [ "$status" -ne 0 ]; then
            echo "::error title=RELEASE-LTO reference build failed::status $status; the compile log is in the kernel-release-reference artifact. This step does not gate the kernel, but a failing reference build means the pairing question is still unanswered."
            # Show the first compiler error here so the job page says what broke
            # without needing the artifact.
            fail_log=$(find "$tree/build/xnu/fileset-reference" -name '*-build.log' | head -1)
            if [ -n "$fail_log" ]; then
              echo "--- first errors from $fail_log ---"
              grep -nE 'error:|Error ' "$fail_log" | head -20 || true
            fi
          fi

      - name: Upload the RELEASE-LTO reference
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kernel-release-reference
          path: |
            UniXNU/out/myron/**/tree/build/xnu/fileset-reference/**/mach.release.bcm2837.unstripped.noctf
            UniXNU/out/myron/**/tree/build/xnu/fileset-reference/**/*.log
            UniXNU/out/myron/**/tree/build/xnu/fileset-reference/**/*.json
            UniXNU/out/myron/**/tree/build/xnu/ios-obj/**/mach.development.bcm2837.unstripped.noctf
          if-no-files-found: warn
      - name: Report the kernel
        if: always()
        run: |
          find UniXNU/out -maxdepth 6 -name 'kernel.macho*' -o -name '*.unstripped.noctf' 2>/dev/null | head
          find UniXNU/out -name '*.log' 2>/dev/null | head -20
          records=$(find UniXNU/out -name '*.o.json' | wc -l)
          echo "compile records written: $records"
          test "$records" -gt 0 || echo '::warning::no compile records; the archive builders replay them and will fail'

      # The compile errors land in the build logs rather than on stdout, so ship
      # them as an artifact instead of leaving a failed run undiagnosable.
      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-logs
          path: UniXNU/out/**/logs/
          if-no-files-found: ignore
          retention-days: 14

